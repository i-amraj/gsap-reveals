<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observer Drag & Wheel Scroll</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="overlay">
    <h1>SCROLL OR DRAG</h1>
    <p>Native scrollbars are hidden. Use mouse wheel or click and drag.</p>
  </div>

  <section class="horizontal-wrapper">
    <div class="track">
      <div class="card card-1"><h2>Card 1</h2></div>
      <div class="card card-2"><h2>Card 2</h2></div>
      <div class="card card-3"><h2>Card 3</h2></div>
      <div class="card card-4"><h2>Card 4</h2></div>
      <div class="card card-5"><h2>Card 5</h2></div>
      <div class="card card-6"><h2>Card 6</h2></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Observer.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
