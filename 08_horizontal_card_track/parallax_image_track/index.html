<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Image Track</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Watch the images inside the cards move independently of the track.</p>
  </section>

  <section class="horizontal-section">
    <div class="track">
      <div class="card">
        <div class="parallax-img" style="background: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;"></div>
        <h2>NATURE</h2>
      </div>
      <div class="card">
        <div class="parallax-img" style="background: url('https://images.unsplash.com/photo-168268798150ce-6d58cb45b6e2?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;"></div>
        <h2>DESERT</h2>
      </div>
      <div class="card">
        <div class="parallax-img" style="background: url('https://images.unsplash.com/photo-1682695796254-bf4eb2454558?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;"></div>
        <h2>OCEAN</h2>
      </div>
      <div class="card">
        <div class="parallax-img" style="background: url('https://images.unsplash.com/photo-1682687982501-1e5898cb8f4b?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;"></div>
        <h2>CLIFFS</h2>
      </div>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
