<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Color Shift</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Background color morphs based on the center card.</p>
  </section>

  <!-- The background of this section will be animated -->
  <section class="horizontal-section" id="color-section">
    <div class="track">
      <!-- Added data-color attributes for JS to read -->
      <div class="card card-1" data-color="#4c1d95"><h2>PURPLE</h2></div>
      <div class="card card-2" data-color="#1e3a8a"><h2>BLUE</h2></div>
      <div class="card card-3" data-color="#064e3b"><h2>GREEN</h2></div>
      <div class="card card-4" data-color="#7f1d1d"><h2>RED</h2></div>
      <div class="card card-5" data-color="#78350f"><h2>ORANGE</h2></div>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
