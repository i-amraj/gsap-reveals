<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Reveal on Scroll</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Text physically slides up from the mask as it scrolls into focus.</p>
  </section>

  <section class="horizontal-section" id="text-reveal-section">
    <div class="track">
      <div class="card card-1">
        <div class="mask-container"><h2 class="reveal-text">CREATE</h2></div>
      </div>
      <div class="card card-2">
        <div class="mask-container"><h2 class="reveal-text">DESIGN</h2></div>
      </div>
      <div class="card card-3">
        <div class="mask-container"><h2 class="reveal-text">ANIMATE</h2></div>
      </div>
      <div class="card card-4">
        <div class="mask-container"><h2 class="reveal-text">DEPLOY</h2></div>
      </div>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
