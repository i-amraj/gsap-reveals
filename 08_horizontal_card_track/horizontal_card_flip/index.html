<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Card Flip</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Cards automatically flip to reveal content in the center.</p>
  </section>

  <section class="horizontal-section" id="flip-section">
    <div class="track">
      
      <div class="card">
        <div class="card-inner">
          <div class="card-front"><h2>FRONT 1</h2></div>
          <div class="card-back"><h2>BACK</h2></div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-inner">
          <div class="card-front"><h2>FRONT 2</h2></div>
          <div class="card-back"><h2>BACK</h2></div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-inner">
          <div class="card-front"><h2>FRONT 3</h2></div>
          <div class="card-back"><h2>BACK</h2></div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-inner">
          <div class="card-front"><h2>FRONT 4</h2></div>
          <div class="card-back"><h2>BACK</h2></div>
        </div>
      </div>

    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
