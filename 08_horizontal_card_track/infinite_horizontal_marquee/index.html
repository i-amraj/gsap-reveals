<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Marquee</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>AUTO SCROLL</h1>
    <p>Scroll down or up to speed up the infinite marquee.</p>
  </section>

  <section class="marquee-wrapper">
    <div class="marquee-container">
      <div class="track" id="marquee-track">
        <!-- Original Set -->
        <div class="card card-1"><h2>01</h2></div>
        <div class="card card-2"><h2>02</h2></div>
        <div class="card card-3"><h2>03</h2></div>
        <div class="card card-4"><h2>04</h2></div>
        <!-- Duplicated Set for Seamless Looping -->
        <div class="card card-1"><h2>01</h2></div>
        <div class="card card-2"><h2>02</h2></div>
        <div class="card card-3"><h2>03</h2></div>
        <div class="card card-4"><h2>04</h2></div>
      </div>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
