<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Path Horizontal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Cards travel along a complex SVG path.</p>
  </section>

  <section class="horizontal-section" id="path-section">
    
    <!-- SVG Path covering the viewport -->
    <svg class="path-svg" viewBox="0 0 1000 500" preserveAspectRatio="none">
      <!-- A curved snake-like path from left to right -->
      <path id="snake-path" d="M -100,250 C 200,500 300,0 500,250 C 700,500 800,0 1100,250" fill="transparent" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
    </svg>

    <!-- Cards that will follow the path -->
    <div class="card card-1">1</div>
    <div class="card card-2">2</div>
    <div class="card card-3">3</div>
    <div class="card card-4">4</div>
    <div class="card card-5">5</div>

  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
