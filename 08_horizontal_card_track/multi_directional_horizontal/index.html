<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Directional Horizontal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Two tracks moving in opposite directions.</p>
  </section>

  <section class="horizontal-section" id="multi-section">
    
    <div class="track track-top">
      <div class="card card-1"><h2>T1</h2></div>
      <div class="card card-2"><h2>T2</h2></div>
      <div class="card card-3"><h2>T3</h2></div>
      <div class="card card-4"><h2>T4</h2></div>
    </div>

    <div class="track track-bottom">
      <div class="card card-5"><h2>B1</h2></div>
      <div class="card card-6"><h2>B2</h2></div>
      <div class="card card-7"><h2>B3</h2></div>
      <div class="card card-8"><h2>B4</h2></div>
    </div>

  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
