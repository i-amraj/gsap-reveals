<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skewed Velocity Scroll</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL FAST</h1>
    <p>The faster you scroll, the more the cards skew.</p>
  </section>

  <section class="horizontal-section">
    <div class="track">
      <div class="card card-1"><h2>Fast</h2></div>
      <div class="card card-2"><h2>And</h2></div>
      <div class="card card-3"><h2>Furious</h2></div>
      <div class="card card-4"><h2>Velocity</h2></div>
      <div class="card card-5"><h2>Scroll</h2></div>
    </div>
  </section>

  <section class="spacer">
    <h1>DONE</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
