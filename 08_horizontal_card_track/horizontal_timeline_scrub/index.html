<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Timeline Scrub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Watch the timeline progress bar and markers at the bottom.</p>
  </section>

  <section class="horizontal-section" id="timeline-section">
    <div class="track">
      <div class="card card-1"><h2>01</h2></div>
      <div class="card card-2"><h2>02</h2></div>
      <div class="card card-3"><h2>03</h2></div>
      <div class="card card-4"><h2>04</h2></div>
    </div>
    
    <!-- Timeline UI at bottom -->
    <div class="timeline-wrapper">
      <div class="timeline-track">
        <div class="progress-bar"></div>
        <div class="marker marker-0"></div>
        <div class="marker marker-1"></div>
        <div class="marker marker-2"></div>
        <div class="marker marker-3"></div>
      </div>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
