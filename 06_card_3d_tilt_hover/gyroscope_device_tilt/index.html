<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyroscope Device Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">MOBILE READY</span>
    <h1>GYROSCOPE TILT</h1>
    <p>View on mobile to tilt by moving your physical device (fallback to mouse)</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        <div class="card-content">
          <h2>Sensors</h2>
          <p class="status">Waiting for orientation data...</p>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
