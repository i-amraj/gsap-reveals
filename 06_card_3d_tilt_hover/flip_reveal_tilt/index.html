<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Reveal Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">180 DEGREE ROTATION</span>
    <h1>FLIP REVEAL</h1>
    <p>Move mouse across the entire screen to flip the card completely</p>
  </header>

  <!-- Interactive wrapper covers the screen -->
  <main class="interactive-area">
    
    <div class="card-wrapper">
      <div class="card">
        
        <div class="face front">
          <h2>FRONT</h2>
          <p>Move mouse to edges</p>
        </div>

        <div class="face back">
          <h2>BACK</h2>
          <p>Secret unlocked</p>
        </div>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
