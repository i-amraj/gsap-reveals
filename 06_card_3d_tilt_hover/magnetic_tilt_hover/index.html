<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Tilt Hover</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">PHYSICS ENGINE</span>
    <h1>MAGNETIC PULL TILT</h1>
    <p>Card physically moves towards your cursor while tilting</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card" style="background: linear-gradient(135deg, #6366f1, #a855f7);">
        <div class="card-content">
          <h2>Magnetic Pull</h2>
          <p>Notice how the card doesn't just rotate, it translates X and Y to follow you.</p>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
