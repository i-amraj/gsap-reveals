<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Grid Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">GLOBAL TILT</span>
    <h1>3D GRID WALL</h1>
    <p>Move your mouse anywhere on the screen to tilt the entire grid</p>
  </header>

  <main class="grid-wrapper">
    <div class="grid-board">
      <div class="grid-card">1</div>
      <div class="grid-card">2</div>
      <div class="grid-card">3</div>
      <div class="grid-card">4</div>
      <div class="grid-card">5</div>
      <div class="grid-card">6</div>
      <div class="grid-card">7</div>
      <div class="grid-card">8</div>
      <div class="grid-card">9</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
