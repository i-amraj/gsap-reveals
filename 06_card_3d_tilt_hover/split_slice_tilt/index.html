<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Slice Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">SHATTERED DEPTH</span>
    <h1>SPLIT SLICE TILT</h1>
    <p>Hover to see the card separate into vertical depth planes</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      
      <!-- Slice 1 -->
      <div class="slice slice-left">
        <div class="content">SP</div>
      </div>
      
      <!-- Slice 2 -->
      <div class="slice slice-center">
        <div class="content">LI</div>
      </div>
      
      <!-- Slice 3 -->
      <div class="slice slice-right">
        <div class="content">T!</div>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
