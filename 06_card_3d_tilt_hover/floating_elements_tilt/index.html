<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Elements Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">3D PARALLAX DEPth</span>
    <h1>FLOATING ELEMENTS</h1>
    <p>Children translate on the Z-axis to physically pop out of the card during tilt</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card" style="background: linear-gradient(135deg, #f97316, #fb923c);">
        
        <!-- Elements inside with translateZ -->
        <img src="../../assets/nature1.jpeg" alt="Nature" class="float-img">
        
        <div class="float-content">
          <h2 class="float-title">True Depth</h2>
          <p class="float-text">This text is hovering 60px above the card surface.</p>
          <button class="float-btn">Explore</button>
        </div>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
