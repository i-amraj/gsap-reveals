<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Glitch Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">VELOCITY SENSOR</span>
    <h1>PIXEL GLITCH TILT</h1>
    <p>Shake or tilt the card rapidly to trigger a digital error</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card" data-text="SYSTEM.ERROR">
        
        <div class="card-content">
          <h2>STABLE</h2>
          <p>Don't move too fast.</p>
        </div>
        
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
