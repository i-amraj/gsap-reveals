<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Distortion Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <!-- A colorful background is necessary to see the distortion -->
  <div class="bg-layer">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <header class="header">
    <span class="badge">FROSTED GLASS</span>
    <h1>GLASS DISTORTION TILT</h1>
    <p>Backdrop-filter blur creates a physical magnifying glass effect as it tilts</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        <div class="card-content">
          <h2>Frosted Lens</h2>
          <p>Tilt the glass to inspect the background blobs.</p>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
