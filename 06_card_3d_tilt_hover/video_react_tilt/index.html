<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video React Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">MEDIA PARALLAX</span>
    <h1>VIDEO REACT TILT</h1>
    <p>Background video shifts dynamically against the tilt direction</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        <!-- Scale the video up slightly so it can shift without showing edges -->
        <video src="https://www.w3schools.com/html/mov_bbb.mp4" class="bg-video" autoplay loop muted playsinline></video>
        
        <div class="card-content">
          <h2>Cinematic</h2>
          <p>The video responds to your movement.</p>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
