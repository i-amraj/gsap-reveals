<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Trail Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">INTERACTIVE PARTICLES</span>
    <h1>MOUSE TRAIL TILT</h1>
    <p>Particles spawn in 3D space directly on the tilted surface</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        <!-- Particles will be injected here dynamically -->
        
        <div class="card-content">
          <h2>Draw</h2>
          <p>Move your mouse over the card.</p>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
