<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Foil Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">TRADING CARD EFFECT</span>
    <h1>HOLOGRAPHIC FOIL</h1>
    <p>Iridescent gradient shifts its background position based on tilt angle</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        
        <div class="card-content">
          <h2>RARE</h2>
          <p>Holographic Edition</p>
        </div>
        
        <!-- Foil Layer goes on top -->
        <div class="foil"></div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
