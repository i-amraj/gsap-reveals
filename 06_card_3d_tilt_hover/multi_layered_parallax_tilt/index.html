<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Layered Parallax Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">DIORAMA EFFECT</span>
    <h1>MULTI-LAYER PARALLAX</h1>
    <p>Multiple planes separated on the Z-axis create intense volumetric depth</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        <!-- Layer 1: Background -->
        <div class="layer layer-1"></div>
        <!-- Layer 2: Midground Elements -->
        <div class="layer layer-2"></div>
        <!-- Layer 3: Foreground Subject -->
        <div class="layer layer-3">
          <h2>DEPTH</h2>
        </div>
        <!-- Layer 4: Floating Particles/Overlay -->
        <div class="layer layer-4">
          <div class="particle p1"></div>
          <div class="particle p2"></div>
          <div class="particle p3"></div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
