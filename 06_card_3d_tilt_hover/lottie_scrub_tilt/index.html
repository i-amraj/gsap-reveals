<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottie Scrub Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">LOTTIE INTERACTION</span>
    <h1>LOTTIE TILT SCRUB</h1>
    <p>Tilting the card left/right controls the animation frame</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        
        <lottie-player class="lottie" src="https://assets10.lottiefiles.com/packages/lf20_p8bfn5to.json" background="transparent" speed="1"></lottie-player>
        
        <div class="card-content">
          <h2>Interactive</h2>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- Lottie Player -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <script src="script.js"></script>
</body>
</html>
