<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glare Lighting Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">DYNAMIC LIGHTING</span>
    <h1>GLARE EFFECT TILT</h1>
    <p>A simulated light source follows your cursor across the glossy surface</p>
  </header>

  <main class="grid-container">
    
    <!-- Shiny Card 1 -->
    <div class="card-wrapper">
      <div class="card" style="background-color: #1e293b;">
        <!-- The Glare Layer -->
        <div class="glare"></div>
        <div class="card-content">
          <img src="../../assets/nature1.jpeg" class="bg-image" alt="nature">
          <h2>Obsidian</h2>
        </div>
      </div>
    </div>

    <!-- Shiny Card 2 -->
    <div class="card-wrapper">
      <div class="card" style="background-color: #1e293b;">
        <div class="glare"></div>
        <div class="card-content">
          <img src="../../assets/nature2.jpeg" class="bg-image" alt="nature">
          <h2>Sapphire</h2>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
