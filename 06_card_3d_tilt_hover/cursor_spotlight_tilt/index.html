<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Spotlight Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">ILLUMINATION</span>
    <h1>CURSOR SPOTLIGHT</h1>
    <p>The mouse acts as a flashlight on the 3D surface</p>
  </header>

  <main class="grid-container">
    
    <div class="card-wrapper">
      <div class="card">
        
        <!-- The spotlight layer -->
        <div class="spotlight"></div>
        
        <div class="card-content">
          <img src="../../assets/nature1.jpeg" class="bg-img" alt="bg">
          <h2>Discover</h2>
          <p>Shine a light to reveal the hidden background.</p>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
