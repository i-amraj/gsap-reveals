<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Column Shift</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">CROSS-CONTAINER FLIP</span>
    <h1>KANBAN SHIFT</h1>
    <p>Click a task to move it to the next column. Watch it fly across parents.</p>
  </header>

  <main class="kanban-board">
    
    <div class="column" id="col-todo">
      <h2>To Do</h2>
      <div class="column-content">
        <div class="task-card">Design System</div>
        <div class="task-card">API Integration</div>
        <div class="task-card">Database Schema</div>
      </div>
    </div>

    <div class="column" id="col-doing">
      <h2>In Progress</h2>
      <div class="column-content">
        <div class="task-card">GSAP Flip Module</div>
      </div>
    </div>

    <div class="column" id="col-done">
      <h2>Done</h2>
      <div class="column-content">
        <div class="task-card">3D Tilt Module</div>
        <div class="task-card">Scroll Stacking</div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
