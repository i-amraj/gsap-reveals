<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Cart Fly</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">CART ANIMATION</span>
    <h1>FLY TO CART</h1>
    <p>Using Flip to animate clones across the screen into a target container.</p>
  </header>

  <div class="cart-wrapper">
    <div id="cart-icon">🛒 <span id="cart-count">0</span></div>
  </div>

  <main class="product-grid" id="grid">
    
    <div class="product">
      <div class="prod-img img-1"></div>
      <h3>Sneakers Pro</h3>
      <button class="add-btn">Add to Cart</button>
    </div>
    
    <div class="product">
      <div class="prod-img img-2"></div>
      <h3>Smart Watch</h3>
      <button class="add-btn">Add to Cart</button>
    </div>
    
    <div class="product">
      <div class="prod-img img-3"></div>
      <h3>Wireless Earbuds</h3>
      <button class="add-btn">Add to Cart</button>
    </div>
    
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
