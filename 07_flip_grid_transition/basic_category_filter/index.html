<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Category Filter</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">GSAP FLIP PLUGIN</span>
    <h1>CATEGORY FILTERING</h1>
    <p>Seamlessly animate layout changes when filtering items</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="ui">UI Design</button>
    <button class="filter-btn" data-filter="web">Web Dev</button>
    <button class="filter-btn" data-filter="app">Mobile App</button>
  </div>

  <main class="grid-container">
    <div class="grid-item" data-category="ui">
      <h3>Dashboard UI</h3>
      <span>UI Design</span>
    </div>
    <div class="grid-item" data-category="web">
      <h3>E-Commerce</h3>
      <span>Web Dev</span>
    </div>
    <div class="grid-item" data-category="app">
      <h3>Fitness Tracker</h3>
      <span>Mobile App</span>
    </div>
    <div class="grid-item" data-category="ui">
      <h3>Banking App</h3>
      <span>UI Design</span>
    </div>
    <div class="grid-item" data-category="web">
      <h3>Portfolio Site</h3>
      <span>Web Dev</span>
    </div>
    <div class="grid-item" data-category="app">
      <h3>Food Delivery</h3>
      <span>Mobile App</span>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
