<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Size Shuffle</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">CHAOS MODE</span>
    <h1>RANDOM REFLOW</h1>
    <p>Every shuffle randomly alters both the size and the DOM order of the items.</p>
  </header>

  <div class="controls">
    <button id="shuffle-btn">Chaos Shuffle</button>
  </div>

  <main class="grid-container" id="grid">
    <!-- Generated via JS -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
