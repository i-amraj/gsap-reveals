<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Remove Items</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">DOM MANIPULATION</span>
    <h1>DYNAMIC GRID REFLOW</h1>
    <p>Click the button to add items, click any item to remove it.</p>
  </header>

  <div class="controls">
    <button id="add-btn">Add New Item +</button>
  </div>

  <main class="grid-container" id="grid">
    <!-- Initial Items -->
    <div class="item"><h3>1</h3></div>
    <div class="item"><h3>2</h3></div>
    <div class="item"><h3>3</h3></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
