<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Image Expansion</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">SHARED ELEMENT TRANSITION</span>
    <h1>HERO EXPANSION</h1>
    <p>Click any image to expand it into a full-screen hero banner, then click again to close.</p>
  </header>

  <main class="gallery-grid">
    <div class="thumb" style="background: linear-gradient(135deg, #f43f5e, #e11d48);"><h2>01</h2></div>
    <div class="thumb" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);"><h2>02</h2></div>
    <div class="thumb" style="background: linear-gradient(135deg, #10b981, #047857);"><h2>03</h2></div>
    <div class="thumb" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);"><h2>04</h2></div>
    <div class="thumb" style="background: linear-gradient(135deg, #f59e0b, #d97706);"><h2>05</h2></div>
    <div class="thumb" style="background: linear-gradient(135deg, #06b6d4, #0891b2);"><h2>06</h2></div>
  </main>

  <div class="overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
