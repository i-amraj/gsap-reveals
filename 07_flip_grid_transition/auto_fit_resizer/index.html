<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Fit Resizer</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">CSS GRID MAGIC</span>
    <h1>AUTO-FIT RESPONSIVE</h1>
    <p>Resize the container. Flip animates the CSS grid auto-fit reflow seamlessly.</p>
  </header>

  <div class="controls">
    <button class="resize-btn" data-width="100%">100% Width</button>
    <button class="resize-btn" data-width="60%">60% Width</button>
    <button class="resize-btn" data-width="30%">30% Width</button>
  </div>

  <!-- Note: we need an outer wrapper so the container can be aligned center while shrinking -->
  <div class="wrapper">
    <main class="grid-container" id="grid">
      <div class="item"></div><div class="item"></div><div class="item"></div>
      <div class="item"></div><div class="item"></div><div class="item"></div>
      <div class="item"></div><div class="item"></div><div class="item"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
