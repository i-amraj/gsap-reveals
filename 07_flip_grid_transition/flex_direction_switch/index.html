<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Direction Switch</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">FLEXBOX FLIP</span>
    <h1>ORIENTATION SHIFT</h1>
    <p>Morph effortlessly between row and column layouts.</p>
  </header>

  <div class="controls">
    <button id="toggle-flex">Toggle Column/Row Mode</button>
  </div>

  <main class="flex-container" id="flexbox">
    <div class="child"><h3>A</h3></div>
    <div class="child"><h3>B</h3></div>
    <div class="child"><h3>C</h3></div>
    <div class="child"><h3>D</h3></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
