<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Grouping</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">DOM SORTING</span>
    <h1>CATEGORY GROUPING</h1>
    <p>Watch scattered items perfectly swarm into organized color groups.</p>
  </header>

  <div class="controls">
    <button id="group-btn">Group by Color</button>
    <button id="shuffle-btn">Shuffle Randomly</button>
  </div>

  <main class="grid-container" id="grid">
    <!-- Items generated via JS -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
