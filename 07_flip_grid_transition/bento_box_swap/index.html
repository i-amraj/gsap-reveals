<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Box Swap</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">DENSE GRID</span>
    <h1>BENTO SWAP</h1>
    <p>Click two items to swap their positions. GSAP handles the dense reflow.</p>
  </header>

  <main class="bento-grid" id="grid">
    <div class="bento-item span-2x2"><h3>1 (Large)</h3></div>
    <div class="bento-item"><h3>2</h3></div>
    <div class="bento-item span-tall"><h3>3 (Tall)</h3></div>
    <div class="bento-item"><h3>4</h3></div>
    <div class="bento-item span-wide"><h3>5 (Wide)</h3></div>
    <div class="bento-item"><h3>6</h3></div>
    <div class="bento-item"><h3>7</h3></div>
    <div class="bento-item span-wide"><h3>8 (Wide)</h3></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
