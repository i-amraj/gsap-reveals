<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choreographed Stagger</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">CHOREOGRAPHY</span>
    <h1>STAGGERED FLIP</h1>
    <p>Using stagger, onEnter, and onLeave for complex animated sequences.</p>
  </header>

  <div class="controls">
    <button class="filter-btn" data-filter="all">All</button>
    <button class="filter-btn" data-filter="red">Red</button>
    <button class="filter-btn" data-filter="blue">Blue</button>
  </div>

  <main class="grid-container" id="grid">
    <div class="item" data-type="red"></div>
    <div class="item" data-type="blue"></div>
    <div class="item" data-type="red"></div>
    <div class="item" data-type="blue"></div>
    <div class="item" data-type="blue"></div>
    <div class="item" data-type="red"></div>
    <div class="item" data-type="red"></div>
    <div class="item" data-type="blue"></div>
    <div class="item" data-type="red"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
