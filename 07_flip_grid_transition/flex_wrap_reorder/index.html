<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Wrap Reorder</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <span class="badge">FLEXBOX WRAPPING</span>
    <h1>FLEX REORDER</h1>
    <p>Click any tag to swap it with the next one. Watch the rows wrap smoothly.</p>
  </header>

  <main class="flex-container" id="flex-box">
    <!-- Dynamic width elements -->
    <div class="tag">UI/UX Design</div>
    <div class="tag">Frontend</div>
    <div class="tag">Backend Infrastructure</div>
    <div class="tag">DevOps</div>
    <div class="tag">React</div>
    <div class="tag">GSAP Animation</div>
    <div class="tag">SEO</div>
    <div class="tag">Laravel</div>
    <div class="tag">Three.js 3D WebGL</div>
    <div class="tag">Flutter</div>
    <div class="tag">Native App</div>
    <div class="tag">QA</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
