<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Vertical Curtain Split</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- THE PRELOADER -->
  <div class="preloader-wrapper">
    <!-- The physical curtains -->
    <div class="curtain-top"></div>
    <div class="curtain-bottom"></div>
    
    <!-- The counter UI -->
    <div class="counter-container">
      <h1 class="counter-text">0%</h1>
      <div class="loading-bar"><div class="progress"></div></div>
    </div>
  </div>

  <!-- THE HERO SECTION -->
  <main class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">EXPERIENCE<br>THE FUTURE</h1>
      <p class="hero-subtitle">Premium web experiences driven by motion.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
