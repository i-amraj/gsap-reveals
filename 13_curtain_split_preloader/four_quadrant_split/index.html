<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Quadrant Split</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- THE PRELOADER -->
  <div class="preloader-wrapper">
    <div class="quad quad-tl"></div>
    <div class="quad quad-tr"></div>
    <div class="quad quad-bl"></div>
    <div class="quad quad-br"></div>
    
    <div class="counter-container">
      <h1 class="counter-text">0%</h1>
    </div>
  </div>

  <!-- THE HERO SECTION -->
  <main class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">EXPAND</h1>
      <p class="hero-subtitle">Multi-directional UI interactions.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
