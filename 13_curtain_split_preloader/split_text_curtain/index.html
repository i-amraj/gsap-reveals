<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Text Curtain</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
</head>
<body>

  <!-- THE PRELOADER -->
  <div class="preloader-wrapper">
    <!-- The physical curtains -->
    <div class="curtain-top"></div>
    <div class="curtain-bottom"></div>
    
    <!-- The split text -->
    <h1 class="counter counter-top">0%</h1>
    <h1 class="counter counter-bottom">0%</h1>
  </div>

  <!-- THE HERO SECTION -->
  <main class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">FRACTURE</h1>
      <p class="hero-subtitle">Text masking and synchronized physics.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
