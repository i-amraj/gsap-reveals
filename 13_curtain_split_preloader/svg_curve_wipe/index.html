<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Curve Wipe</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- THE PRELOADER -->
  <div class="preloader-wrapper">
    <svg class="transition-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path id="curve" d="M 0 100 V 0 Q 50 0 100 0 V 100 Z" fill="#6366f1" />
    </svg>
    
    <div class="counter-container">
      <h1 class="counter-text">0</h1>
    </div>
  </div>

  <!-- THE HERO SECTION -->
  <main class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">LIQUIDITY</h1>
      <p class="hero-subtitle">Organic vector animations.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
