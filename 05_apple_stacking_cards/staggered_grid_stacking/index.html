<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staggered Grid Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="spacer-hero">
    <span class="badge">PIECE BY PIECE</span>
    <h1>STAGGERED GRID</h1>
    <p>Grids break down individually as they are covered</p>
  </header>

  <div class="cards-wrapper">
    <!-- Grid 1 -->
    <div class="grid-container">
      <div class="card-grid">
        <div class="card" style="background-color: #ef4444;">1</div>
        <div class="card" style="background-color: #f97316;">2</div>
        <div class="card" style="background-color: #eab308;">3</div>
        <div class="card" style="background-color: #84cc16;">4</div>
      </div>
    </div>
    
    <!-- Grid 2 -->
    <div class="grid-container">
      <div class="card-grid">
        <div class="card" style="background-color: #06b6d4;">1</div>
        <div class="card" style="background-color: #3b82f6;">2</div>
        <div class="card" style="background-color: #6366f1;">3</div>
        <div class="card" style="background-color: #8b5cf6;">4</div>
      </div>
    </div>

    <!-- Grid 3 -->
    <div class="grid-container">
      <div class="card-grid">
        <div class="card" style="background-color: #d946ef;">1</div>
        <div class="card" style="background-color: #f43f5e;">2</div>
        <div class="card" style="background-color: #000; border: 2px solid #fff;">3</div>
        <div class="card" style="background-color: #fff; color: #000;">4</div>
      </div>
    </div>
  </div>

  <footer class="spacer-footer">
    <h2>End of Grid</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
