<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Fan Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="spacer-hero">
    <span class="badge">ROTATION REVEAL</span>
    <h1>CIRCULAR FAN DECK</h1>
    <p>Cards swing in from alternating sides to stack</p>
  </header>

  <div class="scroll-track">
    <div class="cards-pin-wrapper">
      
      <!-- Card 1 (Base) -->
      <div class="card card-1" style="background-color: #f8fafc; color: #0f172a; z-index: 1;">
        <div class="card-content">
          <h2>Base Card</h2>
          <p>Always here.</p>
        </div>
      </div>
      
      <!-- Card 2 -->
      <div class="card card-2" style="background-color: #3b82f6; color: #fff; z-index: 2;">
        <div class="card-content">
          <h2>Swing Left</h2>
          <p>Rotates in from the left side.</p>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card card-3" style="background-color: #10b981; color: #fff; z-index: 3;">
        <div class="card-content">
          <h2>Swing Right</h2>
          <p>Rotates in from the right side.</p>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="card card-4" style="background-color: #f59e0b; color: #fff; z-index: 4;">
        <div class="card-content">
          <h2>Final Swing</h2>
          <p>Completes the fan deck.</p>
        </div>
      </div>
      
    </div>
  </div>

  <footer class="spacer-footer">
    <h2>End of Deck</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
