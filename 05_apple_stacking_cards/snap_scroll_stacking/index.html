<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Scroll Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <!-- scroll-snap wrapper -->
  <div class="snap-wrapper">
    <div class="snap-section spacer-hero">
      <span class="badge">NATIVE SNAP</span>
      <h1>SNAP SCROLL</h1>
      <p>Try scrolling slowly. The browser snaps you to the next card.</p>
    </div>

    <!-- Card 1 -->
    <div class="snap-section card-container">
      <div class="card" style="background-color: #f8fafc; color: #0f172a;">
        <div class="card-content">
          <h2>Perfect Alignment</h2>
          <p>Scroll down.</p>
        </div>
      </div>
    </div>
    
    <!-- Card 2 -->
    <div class="snap-section card-container">
      <div class="card" style="background-color: #8b5cf6; color: #fff;">
        <div class="card-content">
          <h2>No Half-way</h2>
          <p>You can't stop between cards.</p>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="snap-section card-container">
      <div class="card" style="background-color: #10b981; color: #fff;">
        <div class="card-content">
          <h2>Strict Slideshow</h2>
        </div>
      </div>
    </div>

    <div class="snap-section spacer-footer">
      <h2>End of Snap</h2>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
