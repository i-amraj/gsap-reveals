<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blur Depth Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="spacer-hero">
    <span class="badge">CAMERA FOCUS</span>
    <h1>DEPTH OF FIELD</h1>
    <p>Pinned cards blur heavily as they get covered</p>
  </header>

  <div class="cards-wrapper">
    <!-- Card 1 -->
    <div class="card-container">
      <div class="card" style="background-color: #fef2f2; color: #7f1d1d;">
        <div class="card-content">
          <h2>Sharp Focus</h2>
          <p>The topmost card is always in perfect focus.</p>
        </div>
      </div>
    </div>
    
    <!-- Card 2 -->
    <div class="card-container">
      <div class="card" style="background-color: #f0fdf4; color: #14532d;">
        <div class="card-content">
          <h2>Losing Clarity</h2>
          <p>Notice the card below losing focus completely.</p>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card-container">
      <div class="card" style="background-color: #eff6ff; color: #1e3a8a;">
        <div class="card-content">
          <h2>Deep Blur</h2>
          <p>Simulating optical depth and Z-index layering.</p>
        </div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="card-container">
      <div class="card" style="background-color: #fefce8; color: #713f12;">
        <div class="card-content">
          <h2>The Zenith</h2>
          <p>End of stack.</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="spacer-footer">
    <h2>End of Blur</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
