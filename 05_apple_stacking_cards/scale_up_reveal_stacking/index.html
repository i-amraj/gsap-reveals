<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale Up Reveal Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="spacer-hero">
    <span class="badge">CENTER EXPAND</span>
    <h1>SCALE UP REVEAL</h1>
    <p>Cards grow from the center to overtake the screen</p>
  </header>

  <div class="scroll-track">
    <div class="cards-pin-wrapper">
      
      <div class="card card-1" style="background-color: #f8fafc; color: #0f172a; z-index: 1;">
        <div class="card-content">
          <h2>Base Card</h2>
          <p>Always visible at the start.</p>
        </div>
      </div>
      
      <div class="card card-2" style="background-color: #6366f1; color: #fff; z-index: 2;">
        <div class="card-content">
          <h2>Growing Fast</h2>
          <p>Scales up from 0 to 1.</p>
        </div>
      </div>

      <div class="card card-3" style="background-color: #f43f5e; color: #fff; z-index: 3;">
        <div class="card-content">
          <h2>Overtake</h2>
          <p>The previous card is completely covered.</p>
        </div>
      </div>

      <div class="card card-4" style="background-color: #10b981; color: #fff; z-index: 4;">
        <div class="card-content">
          <h2>Maximum Scale</h2>
          <p>The stack is complete.</p>
        </div>
      </div>
      
    </div>
  </div>

  <footer class="spacer-footer">
    <h2>End of Reveal</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
