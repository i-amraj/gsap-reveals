<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag Throw Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="spacer-hero">
    <span class="badge">INTERACTIVE DRAG</span>
    <h1>THROW TO DISCARD</h1>
    <p>Grab the top card and throw it away to reveal the next</p>
  </header>

  <div class="deck-container">
    <!-- Card 4 (Bottom) -->
    <div class="card card-4" style="background-color: #ef4444; color: #fff;"><h2>Card 4</h2></div>
    <!-- Card 3 -->
    <div class="card card-3" style="background-color: #10b981; color: #fff;"><h2>Card 3</h2></div>
    <!-- Card 2 -->
    <div class="card card-2" style="background-color: #3b82f6; color: #fff;"><h2>Card 2</h2></div>
    <!-- Card 1 (Top) -->
    <div class="card card-1" style="background-color: #f8fafc; color: #000;"><h2>Card 1 (Drag Me)</h2></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- Draggable is required for this effect -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
