<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explode Away Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="spacer-hero">
    <span class="badge">DESTRUCTION EFFECT</span>
    <h1>BURST STACKING</h1>
    <p>Cards explode outward to make way for the next one</p>
  </header>

  <div class="cards-wrapper">
    <!-- Card 1 -->
    <div class="card-container">
      <div class="card" style="background-color: #f8fafc; color: #0f172a;">
        <div class="card-content">
          <h2>Card One</h2>
          <p>I will dissipate outward.</p>
        </div>
      </div>
    </div>
    
    <!-- Card 2 -->
    <div class="card-container">
      <div class="card" style="background-color: #ef4444; color: #fff;">
        <div class="card-content">
          <h2>Card Two</h2>
          <p>Incoming from below.</p>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card-container">
      <div class="card" style="background-color: #8b5cf6; color: #fff;">
        <div class="card-content">
          <h2>Card Three</h2>
          <p>The old card is destroyed.</p>
        </div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="card-container">
      <div class="card" style="background-color: #10b981; color: #fff;">
        <div class="card-content">
          <h2>The Survivor</h2>
          <p>The final card remains.</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="spacer-footer">
    <h2>End of Burst</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
