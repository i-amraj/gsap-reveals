<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Autoplay Stacking</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="spacer-hero">
    <span class="badge">MEDIA CONTROL</span>
    <h1>SMART VIDEO STACK</h1>
    <p>Videos only play when their card is active</p>
  </header>

  <div class="cards-wrapper">
    <!-- Card 1 -->
    <div class="card-container">
      <div class="card">
        <video class="bg-video" src="https://www.w3schools.com/html/mov_bbb.mp4" loop muted playsinline></video>
        <div class="card-content">
          <h2>Video One</h2>
          <p>Plays when visible, pauses when covered.</p>
        </div>
      </div>
    </div>
    
    <!-- Card 2 -->
    <div class="card-container">
      <div class="card">
        <video class="bg-video" src="https://www.w3schools.com/html/mov_bbb.mp4" loop muted playsinline></video>
        <div class="card-content">
          <h2>Video Two</h2>
          <p>Takes over playback seamlessly.</p>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card-container">
      <div class="card">
        <video class="bg-video" src="https://www.w3schools.com/html/mov_bbb.mp4" loop muted playsinline></video>
        <div class="card-content">
          <h2>Video Three</h2>
          <p>Saves CPU by managing media intelligently.</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="spacer-footer">
    <h2>End of Video Stack</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
