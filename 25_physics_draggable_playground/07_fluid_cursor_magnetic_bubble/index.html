<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics 07: Fluid Viscous Jelly Bubble Drag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">Viscoelastic Fluid Mechanics</div>
      <h1>Fluid Viscous Jelly Bubble Drag</h1>
      <p>Drag the gelatinous liquid bubble. As you move, it elongates and squashes along the movement vector. Releasing it triggers a multi-stage viscoelastic jiggle oscillation.</p>
    </header>

    <div class="fluid-stage" id="fluidStage">
      <!-- Viscous Bubble Container -->
      <div class="jelly-bubble" id="jellyBubble">
        <div class="bubble-inner">
          <span class="bubble-label">DRAG JELLY</span>
        </div>
      </div>
    </div>

    <footer class="footer-action">
      <a href="../index.html" class="back-link">← Back to Physics Hub</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
