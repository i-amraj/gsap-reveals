<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics 05: Elastic Rubber-Band Slingshot Pull</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">Dynamic Spline Tension Physics</div>
      <h1>Elastic Rubber-Band Slingshot Pull</h1>
      <p>Click and drag the central neon core. Dynamic SVG tension cords stretch and deform in real time. Release to trigger realistic spring reverberation and oscillation.</p>
    </header>

    <div class="band-stage" id="bandStage">
      <!-- Dynamic SVG Cord -->
      <svg class="cord-svg" id="cordSvg" viewBox="0 0 800 450">
        <defs>
          <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="50%" stop-color="#ec4899"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <!-- Left Cord -->
        <path id="leftCord" d="M 100 225 Q 400 225, 400 225" fill="none" stroke="url(#cordGrad)" stroke-width="4" stroke-linecap="round"/>
        <!-- Right Cord -->
        <path id="rightCord" d="M 700 225 Q 400 225, 400 225" fill="none" stroke="url(#cordGrad)" stroke-width="4" stroke-linecap="round"/>
      </svg>

      <!-- Fixed Left/Right Anchor Posts -->
      <div class="anchor-post post-left"></div>
      <div class="anchor-post post-right"></div>

      <!-- Draggable Slingshot Core -->
      <div class="slingshot-core" id="coreNode">
        <span class="core-glow"></span>
        <span class="core-label">PULL</span>
      </div>

      <div class="tension-display">
        <span>TENSION: <strong id="tensionVal">0%</strong></span>
      </div>
    </div>

    <footer class="footer-action">
      <a href="../index.html" class="back-link">← Back to Physics Hub</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
