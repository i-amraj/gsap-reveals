<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics 02: Gravitational Cascade Tags Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">Gravitational Kinematics</div>
      <h1>Gravitational Cascade Tags Drop</h1>
      <p>Click "Drop Cascade" to release an avalanche of technology pills. Tags accelerate under simulated gravitational freefall, bounce with realistic coefficients of restitution, and settle on the floor.</p>
    </header>

    <div class="gravity-stage" id="stage">
      <!-- Ground Floor Barrier -->
      <div class="ground-line"></div>
    </div>

    <div class="controls-bar">
      <button class="drop-btn" id="dropBtn">⚡ Drop Cascade (Gravitational Freefall)</button>
    </div>

    <footer class="footer-action">
      <a href="../index.html" class="back-link">← Back to Physics Hub</a>
    </footer>
  </div>
