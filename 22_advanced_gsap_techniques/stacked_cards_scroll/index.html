<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stacked Cards Scroll</title><link rel="stylesheet" href="styles.css"></head>
<body>
  
  <div class="spacer"><h2>Scroll Down</h2></div>

  <section class="cards-container">
    <div class="card c1"><h1>Card 1</h1></div>
    <div class="card c2"><h1>Card 2</h1></div>
    <div class="card c3"><h1>Card 3</h1></div>
  </section>

  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
