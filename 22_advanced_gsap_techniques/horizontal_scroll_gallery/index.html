<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizontal Scroll Gallery</title><link rel="stylesheet" href="styles.css"></head>
<body>

  <section class="gallery-container">

      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1682695794816-7b9da18ed470" alt="Nature"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1682687221038-404cb8830901" alt="Nature"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1682695797221-8164ff1fafc9" alt="Nature"></div>
    </div>
  </section>

  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
