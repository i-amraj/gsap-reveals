<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Club GreenSock Confetti</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="confetti-hero">
    
    <div class="card">
      <div class="card-content">
        <h2>Join Club GreenSock</h2>
        <p>Unlock the most powerful animation tools on the planet.</p>
        <button id="join-btn">Sign Up Now</button>
      </div>
      
      <!-- Container for confetti pieces -->
      <div id="confetti-container"></div>
    </div>
    
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- Physics2DPlugin is Club GreenSock, but we can simulate confetti physics with custom eases and standard properties -->
  <script src="script.js"></script>
</body>
</html>
