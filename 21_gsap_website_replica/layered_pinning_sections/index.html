<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Layered Pinning Sections</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h2>Scroll Down</h2></div>

  <!-- We wrap the panels in a container -->
  <div id="panels-container">
    <section class="panel p1">
      <h1>Panel One</h1>
    </section>
    <section class="panel p2">
      <h1>Panel Two</h1>
    </section>
    <section class="panel p3">
      <h1>Panel Three</h1>
    </section>
    <section class="panel p4">
      <h1>Panel Four</h1>
    </section>
  </div>
  
  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
