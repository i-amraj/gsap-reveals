<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ScrollTrigger Demo Pin</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h2>Scroll Down</h2></div>

  <section class="pin-section">
    <div class="left-panel">
      <!-- The element that pins -->
      <div class="box-container" id="pin-box">
        <div class="box"></div>
      </div>
    </div>
    <div class="right-panel">
      <!-- Text that scrolls past -->
      <div class="text-block b1">
        <h2>Start</h2>
        <p>The box pins when it hits the center of the viewport.</p>
      </div>
      <div class="text-block b2">
        <h2>Animate</h2>
        <p>As you scrub, the box rotates and changes color.</p>
      </div>
      <div class="text-block b3">
        <h2>Unpin</h2>
        <p>When this block reaches the center, the box unpins.</p>
      </div>
    </div>
  </section>
  
  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
