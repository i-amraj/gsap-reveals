<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staggered Text Reveal</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h2>Scroll Down</h2></div>

  <section class="stagger-section">
    <div class="text-mask">
      <h1 class="stagger-line">Animation</h1>
    </div>
    <div class="text-mask">
      <h1 class="stagger-line">Built for</h1>
    </div>
    <div class="text-mask">
      <h1 class="stagger-line" style="color:#88ce02">Professionals.</h1>
    </div>
  </section>
  
  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
