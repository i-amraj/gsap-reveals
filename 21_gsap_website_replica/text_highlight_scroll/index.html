<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Text Highlight Scroll</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h2>Scroll Down</h2></div>

  <section class="highlight-section">
    <div class="text-container">
      <h1>GSAP lets you animate <span class="highlight">anything</span> you can select with <span class="highlight">JavaScript</span>.</h1>
    </div>
  </section>
  
  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
