<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MotionPath Logo Orbit</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="orbit-hero">
    
    <div class="center-logo">
      <img src="https://assets.codepen.io/16327/gsap-logo-light.svg" alt="GSAP">
    </div>

    <!-- The SVG Path the elements will follow -->
    <svg class="orbit-path" viewBox="0 0 600 600">
      <path id="circle-path" d="M 300, 300 m -250, 0 a 250,250 0 1,0 500,0 a 250,250 0 1,0 -500,0" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 10"/>
    </svg>

    <!-- Orbiting elements -->
    <div class="satellite s1">JS</div>
    <div class="satellite s2">CSS</div>
    <div class="satellite s3">SVG</div>
    <div class="satellite s4">Canvas</div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- MotionPathPlugin (Core GSAP) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
