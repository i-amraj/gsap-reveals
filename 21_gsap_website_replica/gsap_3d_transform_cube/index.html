<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GSAP 3D Transform Cube</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="cube-hero">
    
    <div class="scene">
      <div class="cube" id="gsap-cube">
        <div class="face front">GSAP</div>
        <div class="face back">Is</div>
        <div class="face right">Super</div>
        <div class="face left">Fast</div>
        <div class="face top">And</div>
        <div class="face bottom">Awesome</div>
      </div>
    </div>
    
    <div class="controls">
      <button id="spin-btn">Random Spin</button>
      <button id="explode-btn">Explode</button>
    </div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
