<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Draggable Physics Bounds</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="drag-hero">
    
    <h2>Grab and Throw!</h2>

    <!-- The bounds container -->
    <div class="bounds" id="drag-bounds">
      <div class="dragger d1">Draggable</div>
      <div class="dragger d2">ThrowProps</div>
      <div class="dragger d3">Bounds</div>
    </div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- Draggable Plugin (Core GSAP) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
