<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Timeline Visualizer</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Signika+Negative:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="timeline-hero">
    
    <div class="stage">
      <div class="box red">1</div>
      <div class="box green">2</div>
      <div class="box blue">3</div>
    </div>
    
    <div class="ui-panel">
      <div class="playhead-container">
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="track">
        <div class="tween t-red">to(".red", {x: 400})</div>
      </div>
      <div class="track">
        <div class="tween t-green">to(".green", {x: 400})</div>
      </div>
      <div class="track">
        <div class="tween t-blue">to(".blue", {x: 400})</div>
      </div>
    </div>
    
    <button id="play-btn">Play Timeline</button>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
