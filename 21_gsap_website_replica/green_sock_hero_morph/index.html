<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Green Sock Hero Morph</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@400;600;700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="gsap-hero">
    <div class="logo-container">
      <svg viewBox="0 0 100 100" class="morph-svg">
        <!-- Initial shape: a square -->
        <path id="shape1" d="M 10,10 L 90,10 L 90,90 L 10,90 Z" fill="#88ce02" />
        <!-- Target shape: a circle (hidden) -->
        <path id="shape2" d="M 50,10 A 40,40 0 1,1 49.9,10 Z" fill="#88ce02" style="visibility:hidden" />
      </svg>
    </div>
    
    <div class="hero-text">
      <h1>Professional-grade animation for the modern web</h1>
      <p>GSAP is a robust JavaScript toolset that turns developers into animation superheroes.</p>
      <button class="cta-btn">Get GSAP</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- Simulating MorphSVG with standard GSAP path animation if nodes are compatible, 
       but for true morphing across disparate path structures, MorphSVGPlugin is needed. 
       Here we will use a CSS/GSAP scaling trick to simulate a morph. -->
  <script src="script.js"></script>
</body>
</html>
