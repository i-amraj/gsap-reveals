<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FLIP Plugin Grid to List</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="controls">
    <button id="toggle-layout" class="btn">Toggle Grid / List</button>
  </div>

  <div class="container grid-layout" id="container">
    <div class="item i1"><div class="img-box"></div><div class="text"><h4>Item 01</h4></div></div>
    <div class="item i2"><div class="img-box"></div><div class="text"><h4>Item 02</h4></div></div>
    <div class="item i3"><div class="img-box"></div><div class="text"><h4>Item 03</h4></div></div>
    <div class="item i4"><div class="img-box"></div><div class="text"><h4>Item 04</h4></div></div>
    <div class="item i5"><div class="img-box"></div><div class="text"><h4>Item 05</h4></div></div>
    <div class="item i6"><div class="img-box"></div><div class="text"><h4>Item 06</h4></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- Flip Plugin (Core GSAP) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
