<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plugin Showcase Carousel</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h2>Scroll Down</h2></div>

  <section class="carousel-section">
    <div class="carousel-container">
      <div class="carousel-wheel">
        <!-- Generative cards representing plugins -->
        <div class="plugin-card">ScrollTrigger</div>
        <div class="plugin-card">MorphSVG</div>
        <div class="plugin-card">SplitText</div>
        <div class="plugin-card">Flip</div>
        <div class="plugin-card">DrawSVG</div>
        <div class="plugin-card">Draggable</div>
        <div class="plugin-card">MotionPath</div>
        <div class="plugin-card">CustomEase</div>
      </div>
    </div>
    
    <h2>Endless Plugins.</h2>
  </section>
  
  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
