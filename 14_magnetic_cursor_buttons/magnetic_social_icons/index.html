<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magnetic Social Icons</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="cursor" id="cursor"></div>
  <main class="page">
    <h1 class="title">Social Icons</h1>
    <p class="subtitle">Hover near the icons — they snap to your cursor magnetically.</p>
    <div class="icon-grid">
      <div class="social-icon" data-label="Twitter/X">✕</div>
      <div class="social-icon" data-label="GitHub">⌥</div>
      <div class="social-icon" data-label="LinkedIn">in</div>
      <div class="social-icon" data-label="Dribbble">✦</div>
      <div class="social-icon" data-label="Instagram">◉</div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
