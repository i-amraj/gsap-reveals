<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Button Hover</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cursor" id="cursor"></div>

  <main class="page">
    <h1 class="title">Magnetic Buttons</h1>
    <p class="subtitle">Hover near a button and feel the pull.</p>

    <div class="button-grid">
      <button class="mag-btn" data-text="LAUNCH">LAUNCH</button>
      <button class="mag-btn" data-text="EXPLORE">EXPLORE</button>
      <button class="mag-btn" data-text="CONTACT">CONTACT</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
