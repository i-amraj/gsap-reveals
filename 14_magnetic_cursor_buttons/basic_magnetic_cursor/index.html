<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Magnetic Cursor</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Custom cursor element -->
  <div class="cursor" id="cursor"></div>

  <!-- Page content -->
  <main class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">Move Your Mouse</h1>
      <p class="hero-subtitle">GSAP <code>quickTo</code> powered smooth cursor tracking.</p>
      <div class="demo-area">
        <p class="hint">The cursor lags behind your mouse — creating a physically satisfying follow effect.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
