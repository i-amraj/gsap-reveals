<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Spotlight Reveal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="spotlight" id="spotlight"></div>
  <main class="page">
    <h1 class="title">Move to Reveal</h1>
    <p class="subtitle">Move your cursor to illuminate the hidden text below.</p>
    <p class="hidden-text">The quick brown fox jumps over the lazy dog. Design is not just what it looks like and feels like. Design is how it works. Move your cursor across this paragraph to reveal the content through the spotlight.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
