<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magnetic Scroll Indicator</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="cursor" id="cursor"></div>
  <section class="hero">
    <h1>Scroll Down</h1>
    <div class="scroll-indicator" id="scroll-indicator">
      <div class="scroll-line"><div class="scroll-fill"></div></div>
      <span>SCROLL</span>
    </div>
  </section>
  <section class="section2"><h2>You made it!</h2></section>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
