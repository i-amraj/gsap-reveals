<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Repulsion Button</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="cursor" id="cursor"></div>
  <main class="page">
    <h1 class="title">Repulsion Buttons</h1>
    <p class="subtitle">These buttons PUSH AWAY from your cursor.</p>
    <div class="grid">
      <button class="repel-btn">Click Me</button>
      <button class="repel-btn">Nope!</button>
      <button class="repel-btn">Run Away</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
