<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Cursor Follower</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- The small dot — snaps to mouse instantly -->
  <div class="cursor-dot" id="cursor-dot"></div>

  <!-- The larger ring — follows with lag -->
  <div class="cursor-ring" id="cursor-ring"></div>

  <main class="page">
    <h1 class="title">Dual Cursor</h1>
    <p class="subtitle">A dot snaps to the mouse. A ring lags behind.</p>

    <div class="card-grid">
      <div class="card">
        <h2>Hover Me</h2>
        <p>The ring morphs when hovering interactive elements.</p>
      </div>
      <div class="card">
        <h2>And Me</h2>
        <p>The ring scales up and changes blend mode on hover.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
