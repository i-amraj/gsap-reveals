<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Image Tilt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <main class="page">
    <h1 class="title">Hover The Images</h1>
    <div class="card-grid">
      <div class="tilt-card"><div class="card-inner" style="background:linear-gradient(135deg,#667eea,#764ba2)"><h2>Aurora</h2></div></div>
      <div class="tilt-card"><div class="card-inner" style="background:linear-gradient(135deg,#f093fb,#f5576c)"><h2>Nebula</h2></div></div>
      <div class="tilt-card"><div class="card-inner" style="background:linear-gradient(135deg,#4facfe,#00f2fe)"><h2>Horizon</h2></div></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
