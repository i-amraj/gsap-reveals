<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magnetic Form Inputs</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="cursor" id="cursor"></div>
  <main class="page">
    <div class="form-card">
      <h1 class="form-title">Get In Touch</h1>
      <form>
        <div class="field-wrap mag-field"><label>Name</label><input type="text" placeholder="Your name"></div>
        <div class="field-wrap mag-field"><label>Email</label><input type="email" placeholder="your@email.com"></div>
        <div class="field-wrap mag-field"><label>Message</label><textarea placeholder="Your message..." rows="4"></textarea></div>
        <button class="submit-btn mag-field" type="submit">Send Message</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
