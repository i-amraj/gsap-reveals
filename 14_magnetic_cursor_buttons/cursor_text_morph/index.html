<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Text Morph</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cursor" id="cursor"><span id="cursor-label"></span></div>

  <main class="page">
    <h1 class="title">Hover The Cards</h1>
    <div class="card-grid">
      <div class="card" data-cursor="VIEW">
        <h2>Design</h2>
        <p>Award-winning UI systems.</p>
      </div>
      <div class="card" data-cursor="READ">
        <h2>Strategy</h2>
        <p>Brand-first thinking.</p>
      </div>
      <div class="card" data-cursor="OPEN">
        <h2>Motion</h2>
        <p>Life-like animations.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
