<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotionPath 05: Luminescent Multi-Particle Orbit Swarm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">Infinity Spline Kinematics</div>
      <h1>Luminescent Multi-Particle Orbit Swarm</h1>
      <p>A synchronized constellation of 30+ glowing particles traversing an intricate figure-8 / infinity curve. Phase offsets and scale modulation create a living luminescent flux.</p>
    </header>

    <div class="stage-area" id="stageArea">
      <svg class="infinity-svg" viewBox="0 0 1000 500">
        <defs>
          <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
          </linearGradient>
        </defs>
        <!-- Figure-8 / Lemniscate SVG Path -->
        <path id="infinityPath" fill="none" stroke="url(#infGrad)" stroke-width="2" stroke-dasharray="6 6"
              d="M 500 250 
                 C 650 100, 850 100, 850 250 
                 C 850 400, 650 400, 500 250 
                 C 350 100, 150 100, 150 250 
                 C 150 400, 350 400, 500 250 Z"/>
      </svg>

      <!-- Particle Container -->
      <div class="particle-container" id="particlesContainer"></div>
    </div>

    <div class="controls-panel">
      <button class="speed-btn active" data-speed="1">Normal Velocity</button>
      <button class="speed-btn" data-speed="2.5">Hyper Warp (2.5x)</button>
      <button class="speed-btn" data-speed="0.4">Slow Flow (0.4x)</button>
    </div>

    <footer class="footer-action">
      <a href="../index.html" class="back-link">← Back to MotionPath Hub</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
