<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scroll Image Reveal Mask</title><link rel="stylesheet" href="styles.css"></head>
<body>
  
  <div class="spacer"><h2>Scroll Down</h2></div>

  <section class="reveal-section">
    <!-- The mask container restricts the visible area -->
    <div class="image-mask">
      <!-- The image inside will be scaled down as it's revealed -->
      <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Landscape">
    </div>
  </section>

  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
