<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GSAP FLIP Gallery Filter</title><link rel="stylesheet" href="styles.css"></head>
<body>
  
  <div class="controls">
    <button data-filter="all" class="active">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="urban">Urban</button>
  </div>

  <div class="gallery">
    <div class="item nature">Nature 1</div>
    <div class="item urban">Urban 1</div>
    <div class="item nature">Nature 2</div>
    <div class="item urban">Urban 2</div>
    <div class="item nature">Nature 3</div>
    <div class="item urban">Urban 3</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
