<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SVG Path Morph Page Transition</title><link rel="stylesheet" href="styles.css"></head>
<body>
  
  <div class="content">
    <h1>Page Content</h1>
    <button id="transition-btn">Go to Next Page</button>
  </div>

  <!-- The SVG overlay that will animate -->
  <svg class="transition-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
    <!-- Start shape: flat line at top -->
    <path class="overlay-path" d="M 0 0 L 100 0 L 100 0 Q 50 0 0 0 Z" fill="#88ce02" />
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
