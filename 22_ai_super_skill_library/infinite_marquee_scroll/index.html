<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Infinite Marquee Scroll</title><link rel="stylesheet" href="styles.css"></head>
<body>
  
  <div class="spacer"><h2>Scroll Up and Down</h2></div>

  <div class="marquee-container">
    <!-- Duplicate content to create seamless loop -->
    <div class="marquee-track">
      <div class="marquee-item">GSAP IS AWESOME • </div>
      <div class="marquee-item">GSAP IS AWESOME • </div>
      <div class="marquee-item">GSAP IS AWESOME • </div>
      <div class="marquee-item">GSAP IS AWESOME • </div>
    </div>
  </div>

  <div class="spacer"><h2>Keep Scrolling</h2></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
