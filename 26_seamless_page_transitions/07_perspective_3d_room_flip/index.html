<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition 07: 3D Perspective Room Cube Flip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="viewport-3d" id="viewport3D">
    <div class="cube-room" id="cubeRoom">
      <!-- Face 1: Front Page -->
      <section class="room-face face-front" id="faceFront">
        <span class="badge">Chamber 01</span>
        <h1>Spatial Quantum Core</h1>
        <p>A monolithic perspective plane executing volumetric rendering matrices in physical 3D space.</p>
        <button class="flip-btn" id="btnFlipRight">Flip 3D Chamber ➔</button>
      </section>

      <!-- Face 2: Right Page -->
      <section class="room-face face-right" id="faceRight">
        <span class="badge badge-emerald">Chamber 02</span>
        <h1>Neural Hologram Chamber</h1>
        <p>You have navigated across the orthogonal 90-degree spatial axis into the secondary hologram enclosure.</p>
        <button class="flip-btn" id="btnFlipLeft">← Reverse 3D Chamber</button>
      </section>
    </div>
  </div>

  <footer class="footer-action">
    <a href="../index.html" class="back-link">← Back to Transitions Hub</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
