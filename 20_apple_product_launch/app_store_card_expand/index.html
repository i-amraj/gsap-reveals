<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>App Store Card Expand</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="card-hero">
    
    <div class="app-card" id="main-card">
      <div class="card-image"></div>
      <div class="card-content">
        <h4>APP OF THE DAY</h4>
        <h1>Procreate</h1>
        <p class="hidden-text">Discover a new way to draw on iPad. With an all new rendering engine and brush studio.</p>
      </div>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
