<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>iPad Landscape to Portrait</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="ipad-hero">
    
    <div class="ipad-device">
      <div class="ipad-screen">
        <div class="ui-element header"></div>
        <div class="ui-element body-block"></div>
        <div class="ui-element sidebar"></div>
      </div>
    </div>
    
    <div class="text-group">
      <h1 id="orientation-text">Landscape.</h1>
      <p>A new way to work.</p>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
