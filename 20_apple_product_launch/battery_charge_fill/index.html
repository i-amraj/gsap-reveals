<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Battery Charge Fill</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="battery-hero">
    
    <div class="battery-wrapper">
      <div class="battery-outline">
        <div class="battery-fill"></div>
      </div>
      <div class="battery-tip"></div>
    </div>
    
    <div class="hero-text">
      <h1 id="percent">0%</h1>
      <p>All-day battery life.</p>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
