<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Safari Tabs Cascade</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="safari-hero">
    
    <div class="perspective-box">
      <!-- We will create 5 safari windows stacked in 3D -->
      <div class="safari-window w1"><div class="toolbar"></div><div class="page p1"></div></div>
      <div class="safari-window w2"><div class="toolbar"></div><div class="page p2"></div></div>
      <div class="safari-window w3"><div class="toolbar"></div><div class="page p3"></div></div>
      <div class="safari-window w4"><div class="toolbar"></div><div class="page p4"></div></div>
      <div class="safari-window w5"><div class="toolbar"></div><div class="page p5"></div></div>
    </div>
    
    <div class="hero-text">
      <h1>The world's fastest browser.</h1>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
