<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Apple Pay Card Flip</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="pay-hero">
    
    <div class="scene">
      <div class="card">
        <div class="card-face card-front">
          <div class="shine"></div>
          <div class="chip"></div>
          <h2>Apple Card</h2>
        </div>
        <div class="card-face card-back">
          <div class="mag-stripe"></div>
          <p>Goldman Sachs</p>
        </div>
      </div>
    </div>
    
    <div class="hero-text">
      <h1>A new kind of credit card.</h1>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
