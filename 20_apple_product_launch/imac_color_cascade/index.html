<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>iMac Color Cascade</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="imac-hero">
    
    <!-- We will use a grid of iMac silhouettes that cascade in color -->
    <div class="imac-grid">
      <div class="imac c1"></div>
      <div class="imac c2"></div>
      <div class="imac c3"></div>
      <div class="imac c4"></div>
      <div class="imac c5"></div>
      <div class="imac c6"></div>
      <div class="imac c7"></div>
    </div>
    
    <div class="title-overlay">
      <h1>Color<br>Meats<br>Power.</h1>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
