<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Apple TV Parallax Cards</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="tv-hero">
    
    <div class="tv-header">
      <h1>Apple TV 4K</h1>
      <p>The best of TV. Together with your favorite Apple devices.</p>
    </div>

    <div class="cards-container">
      
      <!-- Card 1 -->
      <div class="tv-card">
        <div class="card-layer card-bg" style="background-image:url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80')"></div>
        <div class="card-layer card-title"><h1>MOVIES</h1></div>
        <div class="card-glow"></div>
      </div>

      <!-- Card 2 -->
      <div class="tv-card">
        <div class="card-layer card-bg" style="background-image:url('https://images.unsplash.com/photo-1542204165-65bf26472b9b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80')"></div>
        <div class="card-layer card-title"><h1>SPORTS</h1></div>
        <div class="card-glow"></div>
      </div>
      
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
