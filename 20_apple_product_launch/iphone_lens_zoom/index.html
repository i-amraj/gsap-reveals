<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>iPhone Lens Zoom</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="lens-hero">
    <div class="camera-module">
      <div class="lens lens-top">
        <!-- The image inside the lens we zoom into -->
        <div class="lens-world"></div>
      </div>
      <div class="lens lens-bottom"></div>
      <div class="lens lens-right"></div>
    </div>
    
    <div class="hero-text">
      <h1>Hollywood in your pocket.</h1>
    </div>
  </section>
  
  <!-- Content revealed after zooming THRU the lens -->
  <section class="cinematic-mode">
    <h1>Cinematic Mode</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
