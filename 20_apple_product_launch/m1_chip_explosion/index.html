<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>M1 Chip Explosion</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="chip-hero">
    
    <!-- Abstract 3D Chip layers -->
    <div class="chip-container">
      <div class="layer layer-top">
        <h1>M1</h1>
      </div>
      <div class="layer layer-mid"></div>
      <div class="layer layer-base"></div>
    </div>
    
    <div class="stats">
      <h2 class="stat s1">16-core Neural Engine</h2>
      <h2 class="stat s2">8-core CPU</h2>
      <h2 class="stat s3">8-core GPU</h2>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
