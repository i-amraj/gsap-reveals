<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magic Keyboard Float</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="spacer"><h1>Scroll Down</h1></div>

  <section class="keyboard-hero">
    
    <!-- We will construct a floating cantilever keyboard -->
    <div class="ipad-pro">
      <div class="ipad-screen"></div>
    </div>
    
    <div class="keyboard-base">
      <div class="trackpad"></div>
      <!-- Generate some keys -->
      <div class="keys-container" id="keys"></div>
    </div>
    
    <div class="hero-text">
      <h1>Float.</h1>
      <p>A magical typing experience.</p>
    </div>

  </section>
  
  <div class="spacer"><h1>Keep Scrolling</h1></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
