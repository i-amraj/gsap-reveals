<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Path Follow Stagger</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="path-section">
    <!-- SVG Path for visual reference -->
    <svg class="path-svg" viewBox="0 0 1000 400" preserveAspectRatio="none">
      <path id="curve" d="M 0 200 C 250 50, 750 350, 1000 200" fill="transparent" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
    </svg>
    
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- MotionPathPlugin required for true path following, using approximation via CSS/stagger here for pure ScrollTrigger demo -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
