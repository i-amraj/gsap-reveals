<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Text Image Sync Reveal</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="sync-section">
    <div class="sync-item">
      <div class="img-wrap"><img src="https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=800&auto=format&fit=crop"></div>
      <div class="text-wrap"><h2>Photography</h2><p>Capturing the moment.</p></div>
    </div>
    <div class="sync-item">
      <div class="img-wrap"><img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=800&auto=format&fit=crop"></div>
      <div class="text-wrap"><h2>Nature</h2><p>Exploring the wild.</p></div>
    </div>
    <div class="sync-item">
      <div class="img-wrap"><img src="https://images.unsplash.com/photo-1506744012022-b5e13d100062?q=80&w=800&auto=format&fit=crop"></div>
      <div class="text-wrap"><h2>Landscapes</h2><p>Wide open spaces.</p></div>
    </div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
