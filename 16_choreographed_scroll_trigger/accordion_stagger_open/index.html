<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Accordion Stagger Open</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="accordion-section" id="acc-sec">
    <div class="acc-wrap">
      <div class="acc-item"><div class="acc-header">Panel 1</div><div class="acc-content"><p>Content for panel 1...</p></div></div>
      <div class="acc-item"><div class="acc-header">Panel 2</div><div class="acc-content"><p>Content for panel 2...</p></div></div>
      <div class="acc-item"><div class="acc-header">Panel 3</div><div class="acc-content"><p>Content for panel 3...</p></div></div>
    </div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
