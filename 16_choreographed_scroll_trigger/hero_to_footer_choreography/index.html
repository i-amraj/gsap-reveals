<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hero to Footer Choreography</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet"></head>
<body>
  
  <!-- One giant timeline orchestrates the entire page -->
  <div class="page-wrap" id="page-wrap">
    
    <section class="hero">
      <h1 class="hero-title">MASTER</h1>
      <h1 class="hero-title">TIMELINE</h1>
    </section>
    
    <section class="mid">
      <div class="box m-box1"></div>
      <div class="box m-box2"></div>
      <div class="box m-box3"></div>
    </section>

    <footer class="footer">
      <h2 class="footer-text">FIN.</h2>
    </footer>

  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
