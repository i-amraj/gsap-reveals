<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Character Reveal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Characters decode and fade in randomly on scroll.</p>
  </section>

  <section class="text-section">
    <div class="container">
      <p class="split-text">
        Predictability is boring. By staggering character reveals entirely at random, the text appears to decode itself dynamically in real-time, pulling the user deeper into the digital matrix of your interface.
      </p>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://unpkg.com/split-type"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
