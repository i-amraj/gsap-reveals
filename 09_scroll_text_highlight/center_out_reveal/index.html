<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center Out Reveal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Words ripple outwards starting from the center.</p>
  </section>

  <section class="text-section">
    <div class="container">
      <p class="split-text">
        Break the mold of standard left-to-right reading. By staggering an animation from the absolute center of a block of text, the reveal expands like a shockwave, creating an immediate, centralized focal point for the user.
      </p>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://unpkg.com/split-type"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
