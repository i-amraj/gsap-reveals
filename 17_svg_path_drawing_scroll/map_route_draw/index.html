<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Map Route Draw</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="map-section">
    <div class="map-container">
      <!-- Fictional map background -->
      <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=800&auto=format&fit=crop" class="map-bg" alt="Map">
      
      <!-- Route overlay -->
      <svg class="map-svg" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="route" d="M 100 100 Q 200 150 250 300 T 500 400 Q 600 200 700 100" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>
      </svg>
      
      <!-- Markers -->
      <div class="marker start" style="top:100px; left:100px;">A</div>
      <div class="marker end" style="top:100px; left:700px; opacity:0;">B</div>
    </div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
