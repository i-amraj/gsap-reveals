<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scroll Erase Path</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down to Erase</h1></div>
  
  <section class="erase-section">
    <svg class="erase-svg" viewBox="0 0 800 200">
      <!-- A fully drawn zig-zag path -->
      <path id="erase-path" d="M 0 100 L 100 0 L 200 200 L 300 0 L 400 200 L 500 0 L 600 200 L 700 0 L 800 100" fill="none" stroke="#ec4899" stroke-width="8" stroke-linejoin="round"/>
    </svg>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
