<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Underline Text</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="underline-section">
    <div class="text-container">
      <h1 class="headline">Highlight the <span class="highlight-wrap">important<svg class="underline-svg" viewBox="0 0 200 40" preserveAspectRatio="none"><path id="underline-path" d="M 0 30 Q 100 40 200 20" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/></svg></span> details.</h1>
    </div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
