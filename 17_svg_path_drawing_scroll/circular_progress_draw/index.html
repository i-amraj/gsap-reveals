<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Circular Progress Draw</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <!-- High page to allow scrolling -->
  <div class="scroll-container">
    <h1>Scroll to see progress</h1>
    
    <!-- Fixed progress indicator -->
    <div class="progress-wrap">
      <svg class="progress-svg" viewBox="0 0 100 100">
        <!-- Background circle -->
        <circle cx="50" cy="50" r="45" fill="none" stroke="#333" stroke-width="5" />
        <!-- Progress circle -->
        <circle id="progress-circle" cx="50" cy="50" r="45" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
      </svg>
      <div class="progress-text" id="progress-text">0%</div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
