<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashed Line Draw</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="dashed-section">
    <!-- To draw a dashed line without a plugin, we can't just animate dashoffset on a single dashed path easily. 
         Instead, we use a solid drawing path as a mask over a dashed path. -->
    <svg class="dashed-svg" viewBox="0 0 800 200">
      <defs>
        <!-- Mask containing a solid white line that will "draw" -->
        <mask id="line-mask">
          <path id="solid-mask-path" d="M 50 100 Q 400 200 750 100" fill="none" stroke="white" stroke-width="12" />
        </mask>
      </defs>
      
      <!-- The visible dashed line, masked by the solid line above -->
      <path class="dashed-path" d="M 50 100 Q 400 200 750 100" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="15, 15" mask="url(#line-mask)" />
    </svg>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
