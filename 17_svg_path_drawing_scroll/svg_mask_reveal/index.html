<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SVG Mask Reveal</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="mask-section">
    <!-- We use an SVG mask to clip an image. The mask is drawn via stroke! -->
    <svg width="0" height="0">
      <defs>
        <mask id="draw-mask">
          <!-- The stroke must be white to reveal the image underneath -->
          <path id="mask-path" d="M 50 250 Q 400 -100 750 250 T 1450 250" fill="none" stroke="white" stroke-width="150" stroke-linecap="round"/>
        </mask>
      </defs>
    </svg>
    
    <div class="image-wrapper">
      <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop" alt="Revealed image" class="reveal-img">
    </div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
