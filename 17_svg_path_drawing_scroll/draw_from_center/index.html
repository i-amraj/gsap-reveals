<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Draw From Center</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="center-section">
    <!-- To draw from center natively without DrawSVGPlugin, we split the path into two paths starting from center -->
    <svg class="center-svg" viewBox="0 0 800 200">
      <!-- Left path starting from center 400 -->
      <path class="half-path" d="M 400 100 L 0 100" fill="none" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
      <!-- Right path starting from center 400 -->
      <path class="half-path" d="M 400 100 L 800 100" fill="none" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
    </svg>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
