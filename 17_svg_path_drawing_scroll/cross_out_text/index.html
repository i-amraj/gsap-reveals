<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cross Out Text</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="cross-section">
    <div class="text-container">
      <h1 class="old-price">$199.99</h1>
      <svg class="cross-svg" viewBox="0 0 200 100" preserveAspectRatio="none">
        <!-- A messy, hand-drawn style cross-out line -->
        <path id="cross-path" d="M 10 70 Q 100 20, 190 30" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="new-price">$99.99</h1>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
