<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Blob Cursor Mask</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">ORGANIC CURSOR</span>
    <h1>LIQUID BLOB MASK</h1>
    <p>Move your cursor to reveal the image underneath through a shape-shifting liquid blob</p>
  </header>

  <main class="card-stage">
    <div class="blob-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Base" class="base-img">
      
      <!-- Blob Mask Layer -->
      <div class="blob-mask-container">
        <img src="../../assets/nature2.jpeg" alt="Nature Reveal" class="reveal-img">
      </div>
      
      <div class="card-caption">
        <h2>LIQUID MASKING</h2>
        <p>Interactive Gooey Cursor Engine</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Liquid Blob Cursor Mask Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
