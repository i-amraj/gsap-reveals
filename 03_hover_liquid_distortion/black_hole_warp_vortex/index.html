<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Hole Warp Vortex</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">EVENT HORIZON</span>
    <h1>BLACK HOLE VORTEX</h1>
    <p>Hover over the card to warp and suck the image into a singularity</p>
  </header>

  <!-- SVG Warp Vortex Filter -->
  <svg style="display: none;">
    <filter id="vortexFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.03" numOctaves="3" result="noise" />
      <feDisplacementMap id="vortexDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="vortex-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Space" class="vortex-img">
      <!-- Dark gradient overlay to simulate depth -->
      <div class="vortex-overlay"></div>
      <div class="card-caption">
        <h2>WARP SINGULARITY</h2>
        <p>Inward Scale & Extreme Displacement</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Black Hole Warp Vortex Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
