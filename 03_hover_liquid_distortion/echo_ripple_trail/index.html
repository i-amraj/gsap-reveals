<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Ripple Trail</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">CONCENTRIC ECHOES</span>
    <h1>ECHO RIPPLE TRAIL</h1>
    <p>Move your cursor over the image to leave a trail of water-like ripples</p>
  </header>

  <main class="card-stage">
    <div class="echo-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Echo" class="echo-img">
      <!-- Container for dynamically generated ripple divs -->
      <div class="ripple-container"></div>
      
      <div class="card-caption">
        <h2>INTERACTIVE WAVES</h2>
        <p>GSAP Dynamic DOM Spawning</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Echo Ripple Trail Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
