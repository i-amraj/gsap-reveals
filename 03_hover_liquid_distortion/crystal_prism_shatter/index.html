<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Prism Shatter</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">GEOMETRIC FRAGMENTATION</span>
    <h1>CRYSTAL PRISM SHATTER</h1>
    <p>Hover over the card to shatter the image into glass crystal shards</p>
  </header>

  <main class="card-stage">
    <div class="crystal-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Base" class="base-img">
      
      <!-- Crystal Fragments (overlapping pieces) -->
      <div class="shard shard-1"><img src="../../assets/nature1.jpeg" alt="Shard"></div>
      <div class="shard shard-2"><img src="../../assets/nature1.jpeg" alt="Shard"></div>
      <div class="shard shard-3"><img src="../../assets/nature1.jpeg" alt="Shard"></div>
      <div class="shard shard-4"><img src="../../assets/nature1.jpeg" alt="Shard"></div>
      <div class="shard shard-5"><img src="../../assets/nature1.jpeg" alt="Shard"></div>
      <div class="shard shard-6"><img src="../../assets/nature1.jpeg" alt="Shard"></div>

      <div class="card-caption">
        <h2>GLASS PRISM SHATTER</h2>
        <p>Dynamic GSAP Fragment Explosion</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Crystal Prism Shatter Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
