<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Wave Liquid Ripple Displacement Hover</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">STYLE 1.3 - WEBGL & LIQUID DISTORTION</span>
    <h1>WATER RIPPLE HOVER</h1>
    <p>Hover over the nature card to trigger interactive liquid water displacement ripples</p>
  </header>

  <!-- SVG Liquid Ripple Filter -->
  <svg style="display: none;">
    <filter id="liquidRippleFilter">
      <feTurbulence id="liquidTurbulence" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap id="liquidDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="liquid-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Liquid Ripple" class="liquid-img">
      <div class="card-caption">
        <h2>LIQUID RIPPLE FLOW</h2>
        <p>Interactive SVG Displacement Engine</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Water Wave Liquid Ripple Displacement Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
