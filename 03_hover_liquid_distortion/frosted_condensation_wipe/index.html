<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosted Condensation Wipe</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">WINTER GLASS</span>
    <h1>FROSTED WIPE REVEAL</h1>
    <p>Move your cursor to wipe away the frosted window condensation</p>
  </header>

  <main class="card-stage">
    <div class="frost-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Under Glass" class="base-img">
      
      <!-- Frosted Overlay with dynamic mask -->
      <div class="frost-overlay"></div>
      
      <div class="card-caption">
        <h2>CLEARING THE MIST</h2>
        <p>Interactive Cursor Masking Wipe</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Frosted Condensation Wipe Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
