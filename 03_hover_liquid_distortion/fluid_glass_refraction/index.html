<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Glass Lens Refraction Distortion Hover</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">FLUID GLASS REFRACTION</span>
    <h1>LENS DISTORTION HOVER</h1>
    <p>Move mouse across card to guide the refractive fluid glass lens</p>
  </header>

  <main class="card-stage">
    <div class="glass-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Fluid Glass" class="bg-img">
      <div class="glass-lens">
        <img src="../../assets/nature1.jpeg" alt="Refracted Nature" class="lens-img">
      </div>
      <div class="card-caption">
        <h2>FLUID GLASS REFRACTION</h2>
        <p>Awwwards Liquid Lens Physics Engine</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Fluid Glass Lens Refraction Distortion Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
