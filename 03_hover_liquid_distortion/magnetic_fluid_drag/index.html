<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Fluid Drag</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">SURFACE TENSION</span>
    <h1>MAGNETIC FLUID DRAG</h1>
    <p>Move cursor over the card to drag the liquid surface paint</p>
  </header>

  <!-- SVG Magnetic Fluid Filter -->
  <svg style="display: none;">
    <filter id="fluidFilter">
      <feTurbulence id="fluidTurbulence" type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="3" result="noise" />
      <feDisplacementMap id="fluidDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="drag-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Fluid" class="drag-img">
      <div class="card-caption">
        <h2>LIQUID DRAG</h2>
        <p>Interactive Cursor Smear Engine</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Magnetic Fluid Drag Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
