<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonic Boom Shockwave</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">RADIAL IMPACT</span>
    <h1>SONIC BOOM SHOCKWAVE</h1>
    <p>Hover over the card to blast a sudden displacement shockwave across the image</p>
  </header>

  <!-- SVG Shockwave Filter -->
  <svg style="display: none;">
    <filter id="shockwaveFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" result="noise" />
      <feDisplacementMap id="shockDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="boom-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Boom" class="boom-img">
      <div class="card-caption">
        <h2>IMPACT RIPPLE</h2>
        <p>Immediate GSAP Radial Displacement Blast</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Sonic Boom Shockwave Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
