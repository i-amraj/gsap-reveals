<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heat Wave Mirage Shimmer</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">CINEMATIC MIRAGE</span>
    <h1>HEAT WAVE SHIMMER</h1>
    <p>Hover over the card to intensify the desert heat wave distortion</p>
  </header>

  <!-- SVG Heat Wave Filter -->
  <svg style="display: none;">
    <filter id="heatFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.08" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" values="0.04 0.08; 0.05 0.1; 0.04 0.08" dur="4s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap id="heatDispMap" in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="heat-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Heat" class="heat-img">
      <div class="card-caption">
        <h2>MIRAGE DISTORTION</h2>
        <p>Continuous High-Frequency Heat Haze</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Heat Wave Mirage Shimmer Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
