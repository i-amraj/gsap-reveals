<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGB Split Chromatic Liquid Distortion Hover</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">RGB CHROMATIC LIQUID</span>
    <h1>CHANNEL SPLIT WAVE</h1>
    <p>Hover over the card to split RGB color channels along liquid wave turbulence</p>
  </header>

  <!-- SVG RGB Split Liquid Filter -->
  <svg style="display: none;">
    <filter id="rgbLiquidFilter">
      <feTurbulence id="rgbTurbulence" type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap id="rgbDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="rgb-card">
      <div class="rgb-layer red-layer"><img src="../../assets/nature2.jpeg" alt="RGB Red"></div>
      <div class="rgb-layer blue-layer"><img src="../../assets/nature2.jpeg" alt="RGB Blue"></div>
      <div class="rgb-layer main-layer"><img src="../../assets/nature2.jpeg" alt="RGB Main" class="filtered-img"></div>
      <div class="card-caption">
        <h2>RGB CHROMATIC WAVE</h2>
        <p>Cyberpunk Channel Split Liquid Engine</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>RGB Split Chromatic Liquid Distortion Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
