<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Sort Glitch Melt</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">CYBERPUNK GLITCH</span>
    <h1>PIXEL SORT MELT</h1>
    <p>Hover over the card to melt the image downwards in a digital pixel sort</p>
  </header>

  <!-- SVG Pixel Sort Filter -->
  <svg style="display: none;">
    <filter id="pixelSortFilter">
      <!-- High X frequency, low Y frequency for vertical stretching bands -->
      <feTurbulence type="fractalNoise" baseFrequency="0.2 0.001" numOctaves="1" result="noise" />
      <feDisplacementMap id="pixelDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="melt-card">
      <img src="../../assets/nature2.jpeg" alt="Nature Cyber Glitch" class="melt-img">
      <div class="card-caption">
        <h2>DATAMOSH MELT</h2>
        <p>Vertical Pixel Sort Displacement</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Pixel Sort Glitch Melt Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
