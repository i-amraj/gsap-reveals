<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oil Paint Swirl</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">FINE ART TEXTURE</span>
    <h1>OIL PAINT SWIRL</h1>
    <p>Hover over the card to smudge the canvas in thick, wet oil paint strokes</p>
  </header>

  <!-- SVG Oil Paint Filter -->
  <svg style="display: none;">
    <filter id="oilFilter">
      <!-- High numOctaves creates the complex, detailed texture -->
      <feTurbulence id="oilTurbulence" type="fractalNoise" baseFrequency="0.015" numOctaves="5" result="noise" />
      <feDisplacementMap id="oilDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="oil-card">
      <img src="../../assets/nature2.jpeg" alt="Nature Art" class="oil-img">
      <!-- Subtle canvas texture overlay -->
      <div class="canvas-texture"></div>
      <div class="card-caption">
        <h2>VAN GOGH SMUDGE</h2>
        <p>High-Octave SVG Turbulence Swirl</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Oil Paint Swirl Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
