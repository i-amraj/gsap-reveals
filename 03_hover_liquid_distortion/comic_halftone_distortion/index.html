<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Halftone Distortion</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">POP ART GRAPHIC</span>
    <h1>HALFTONE DISTORTION</h1>
    <p>Hover over the card to warp the comic book dot print</p>
  </header>

  <!-- SVG Halftone & Distortion Filter -->
  <svg style="display: none;">
    <defs>
      <!-- Halftone Dot Pattern -->
      <pattern id="halftonePattern" width="4" height="4" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.5" fill="#000" />
      </pattern>
    </defs>
    <filter id="halftoneFilter">
      <!-- We will just apply turbulence here, the halftone itself is applied via CSS mix-blend-mode for cleaner results -->
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" result="noise" />
      <feDisplacementMap id="comicDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="comic-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Comic" class="comic-img">
      <!-- Halftone Pattern Overlay -->
      <div class="halftone-overlay"></div>
      <div class="card-caption">
        <h2>RETRO DOT WARP</h2>
        <p>Interactive SVG Halftone Wave</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Comic Halftone Distortion Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
