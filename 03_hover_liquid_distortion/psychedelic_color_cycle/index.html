<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psychedelic Color Cycle</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">TRIPPY SPECTRUM</span>
    <h1>PSYCHEDELIC COLOR CYCLE</h1>
    <p>Hover over the card to trigger liquid waves and rapid hue rotations</p>
  </header>

  <!-- SVG Psychedelic Filter -->
  <svg style="display: none;">
    <filter id="psychoFilter">
      <!-- Hue Rotation Matrix -->
      <feColorMatrix id="hueMatrix" type="hueRotate" values="0" in="SourceGraphic" result="colored" />
      <!-- Liquid Turbulence -->
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
      <feDisplacementMap id="psychoDispMap" in="colored" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="psycho-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Trippy" class="psycho-img">
      <div class="card-caption">
        <h2>COLOR SHIFT WAVE</h2>
        <p>Continuous Hue Rotate & Displacement</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Psychedelic Color Cycle Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
