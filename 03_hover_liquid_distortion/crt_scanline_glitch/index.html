<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRT VHS Scanline Glitch</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">RETRO CYBERPUNK</span>
    <h1>CRT SIGNAL GLITCH</h1>
    <p>Hover over the card to trigger a VHS tape signal distortion</p>
  </header>

  <!-- SVG Glitch Filter -->
  <svg style="display: none;">
    <filter id="glitchFilter">
      <!-- High Y frequency for horizontal bands -->
      <feTurbulence type="fractalNoise" baseFrequency="0.001 0.4" numOctaves="1" result="noise" />
      <feDisplacementMap id="glitchDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="crt-card">
      <img src="../../assets/nature2.jpeg" alt="Nature Glitch" class="crt-img">
      <!-- CSS Scanline Overlay -->
      <div class="scanlines"></div>
      <div class="card-caption">
        <h2>ANALOG DISTORTION</h2>
        <p>Horizontal SVG Signal Glitch</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>CRT VHS Scanline Glitch Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
