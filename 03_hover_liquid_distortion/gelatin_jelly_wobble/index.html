<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelatin Jelly Wobble Hover</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">SOFT-BODY PHYSICS</span>
    <h1>JELY WOBBLE HOVER</h1>
    <p>Hover over the card to trigger an elastic jelly displacement ripple</p>
  </header>

  <!-- SVG Jelly Wobble Filter -->
  <svg style="display: none;">
    <filter id="jellyFilter">
      <feTurbulence id="jellyTurbulence" type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
      <feDisplacementMap id="jellyDispMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="jelly-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Jelly" class="jelly-img">
      <div class="card-caption">
        <h2>GELATIN DYNAMICS</h2>
        <p>GSAP Elastic Spring Physics</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Gelatin Jelly Wobble Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
