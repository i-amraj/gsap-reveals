<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underwater Caustics Ripples</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">AQUATIC DYNAMICS</span>
    <h1>UNDERWATER CAUSTICS</h1>
    <p>Hover over the card to intensify the deep water current ripples</p>
  </header>

  <!-- SVG Underwater Caustics Filter -->
  <svg style="display: none;">
    <filter id="causticsFilter">
      <feTurbulence id="causticTurbulence" type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="3" result="noise">
        <animate attributeName="baseFrequency" values="0.015 0.02; 0.025 0.03; 0.015 0.02" dur="8s" repeatCount="indefinite" id="turbAnim" />
      </feTurbulence>
      <feDisplacementMap id="causticDispMap" in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="card-stage">
    <div class="aqua-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Underwater" class="aqua-img">
      <!-- Caustic light overlay -->
      <div class="caustic-light"></div>
      <div class="card-caption">
        <h2>DEEP WATER FLOW</h2>
        <p>Continuous Caustic Wave Refraction</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Underwater Caustics Ripples Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
