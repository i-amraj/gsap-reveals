<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Canvas Scrub with SVG Mask</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <section class="canvas-section">
    <!-- SVG Clip Path Definition -->
    <svg width="0" height="0">
      <clipPath id="my-clip">
        <path d="M 400 100 Q 700 400 400 700 Q 100 400 400 100 Z" />
      </clipPath>
    </svg>
    
    <div class="canvas-wrapper">
      <canvas id="scrub-canvas" width="800" height="800"></canvas>
    </div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
