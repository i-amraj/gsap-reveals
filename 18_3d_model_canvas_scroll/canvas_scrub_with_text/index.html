<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Canvas Scrub with Text</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down to Experience</h1></div>
  
  <section class="canvas-section">
    <canvas id="scrub-canvas" width="1000" height="800"></canvas>
    
    <!-- Floating Text Overlays -->
    <div class="text-overlay" id="text-1"><h3>Revolutionary Design</h3></div>
    <div class="text-overlay" id="text-2"><h3>360° Vision</h3></div>
    <div class="text-overlay" id="text-3"><h3>Perfect Geometry</h3></div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
