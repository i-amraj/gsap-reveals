<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Canvas Scrub With Audio</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <!-- Note: Modern browsers require user interaction to play audio. -->
  <div class="spacer">
    <h1>Scroll Down</h1>
    <button id="start-btn">Click to Enable Audio</button>
  </div>
  
  <section class="canvas-section">
    <canvas id="scrub-canvas" width="800" height="800"></canvas>
    <div class="audio-indicator" id="audio-ui">Volume: 0%</div>
  </section>

  <div class="spacer"><h1>End</h1></div>
  
  <!-- We'll generate a dummy audio context for demo purposes instead of an external file -->
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
