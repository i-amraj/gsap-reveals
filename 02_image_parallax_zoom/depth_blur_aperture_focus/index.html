<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depth Blur Aperture Focus Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">APERTURE FOCUS DEPTH</span>
    <h1>GAUSSIAN BLUR REVEAL</h1>
    <p>Scroll down to sharpen the camera depth-of-field lens focus</p>
  </header>

  <section class="focus-pin">
    <div class="focus-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Focus" class="blur-img">
    </div>
    <div class="card-caption">
      <h2>CINEMATIC FOCUS</h2>
      <p>Gaussian Blur (28px ➔ 0px) | Scale (1.35 ➔ 1.0)</p>
    </div>
  </section>

  <footer class="footer">
    <p>Depth Blur Aperture Focus Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
