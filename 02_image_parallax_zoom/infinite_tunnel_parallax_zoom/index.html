<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite 3D Tunnel Parallax Zoom</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">3D TUNNEL CAMERA</span>
    <h1>INFINITE PARALLAX ZOOM</h1>
    <p>Scroll down to travel through 3D concentric nature image frames</p>
  </header>

  <section class="tunnel-pin">
    <div class="tunnel-stage">
      <div class="tunnel-frame frame-1">
        <img src="../../assets/nature1.jpeg" alt="Nature Frame 1">
      </div>
      <div class="tunnel-frame frame-2">
        <img src="../../assets/nature2.jpeg" alt="Nature Frame 2">
      </div>
      <div class="tunnel-frame frame-3">
        <img src="../../assets/nature1.jpeg" alt="Nature Frame 3">
      </div>
    </div>
    <div class="tunnel-overlay">
      <h2>DEEP TUNNEL TRAVEL</h2>
      <p>Continuous Concentric Z-Space Camera Zoom</p>
    </div>
  </section>

  <footer class="footer">
    <p>Infinite 3D Tunnel Parallax Zoom Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
