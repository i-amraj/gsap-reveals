<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlapping Strip Venetian Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">VENETIAN STRIP PARALLAX</span>
    <h1>STAGGERED SHUTTER SLICES</h1>
    <p>Scroll down to see vertical image strips slide at staggered parallax speeds</p>
  </header>

  <section class="strip-section">
    <div class="strip-container">
      <div class="strip strip-1" style="--i: 0"><img src="../../assets/nature1.jpeg" alt="Strip 1"></div>
      <div class="strip strip-2" style="--i: 1"><img src="../../assets/nature1.jpeg" alt="Strip 2"></div>
      <div class="strip strip-3" style="--i: 2"><img src="../../assets/nature1.jpeg" alt="Strip 3"></div>
      <div class="strip strip-4" style="--i: 3"><img src="../../assets/nature1.jpeg" alt="Strip 4"></div>
      <div class="strip strip-5" style="--i: 4"><img src="../../assets/nature1.jpeg" alt="Strip 5"></div>
      <div class="card-caption">
        <h2>KINETIC SHUTTER SLICES</h2>
        <p>5-Strip Staggered Parallax Speed Profile</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Overlapping Strip Venetian Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
