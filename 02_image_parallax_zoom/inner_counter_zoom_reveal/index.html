<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Expand & Counter Zoom Reveal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">INNER COUNTER-ZOOM</span>
    <h1>FULL-BLEED EXPANSION</h1>
    <p>Scroll down to expand the card into a full-bleed viewport</p>
  </header>

  <section class="pin-section">
    <div class="expand-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Full Bleed" class="counter-img">
      <div class="card-caption">
        <h2>EXPANDED PERSPECTIVE</h2>
        <p>Outer Container 45vw ➔ 100vw | Inner Image 1.6 ➔ 1.0 Counter Zoom</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Card Expand & Inner Counter-Zoom Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
