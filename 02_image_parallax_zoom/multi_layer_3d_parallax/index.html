<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Layer 3D Depth Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">MULTI-LAYER 3D PARALLAX</span>
    <h1>DEEP SPATIAL DEPTH</h1>
    <p>Scroll down to experience multi-speed layer parallax</p>
  </header>

  <section class="depth-container">
    <!-- Slow Background Layer -->
    <img src="../../assets/nature1.jpeg" alt="Nature Background" class="layer layer-bg">
    
    <!-- Medium Subject Card Layer -->
    <div class="layer layer-card">
      <img src="../../assets/nature2.jpeg" alt="Nature Subject" class="card-img">
    </div>

    <!-- Fast Foreground Text Layer -->
    <div class="layer layer-fg">
      <h2>NATURAL IMMERSION</h2>
      <p>3D Multi-Layer Camera Motion Engine</p>
    </div>
  </section>

  <footer class="footer">
    <p>Multi-Layer 3D Depth Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
