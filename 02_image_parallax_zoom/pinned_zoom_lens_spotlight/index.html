<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Magnifying Zoom Lens</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">MAGNIFYING ZOOM LENS</span>
    <h1>SPOTLIGHT DETAIL INSPECTOR</h1>
    <p>Scroll down to traverse the 2.5x magnifying spotlight lens across the image</p>
  </header>

  <section class="lens-pin">
    <div class="image-stage">
      <img src="../../assets/nature1.jpeg" alt="Base Nature" class="base-img">
      <div class="magnifier-lens">
        <img src="../../assets/nature1.jpeg" alt="Zoomed Nature" class="zoomed-img">
      </div>
    </div>
    <div class="card-caption">
      <h2>2.5X DETAIL INSPECTION</h2>
      <p>Scroll-Driven Traversal Spotlight Engine</p>
    </div>
  </section>

  <footer class="footer">
    <p>Scroll Magnifying Zoom Lens Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
