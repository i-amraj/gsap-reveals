<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisheye Globe Un-Distort Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">FISHEYE GLOBE UN-DISTORT</span>
    <h1>SPHERICAL LENS REVEAL</h1>
    <p>Scroll down to unfold the 3D fisheye sphere into a flat card view</p>
  </header>

  <section class="globe-pin">
    <div class="globe-card">
      <img src="../../assets/nature2.jpeg" alt="Fisheye Nature" class="globe-img">
    </div>
    <div class="card-caption">
      <h2>FISHEYE UN-DISTORTION</h2>
      <p>Spherical Lens Sphere ➔ Flat Viewport Matrix</p>
    </div>
  </section>

  <footer class="footer">
    <p>Fisheye Globe Un-Distort Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
