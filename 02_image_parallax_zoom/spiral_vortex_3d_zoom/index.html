<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Vortex 3D Parallax Zoom</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">SPIRAL VORTEX ZOOM</span>
    <h1>KINETIC ROTATIONAL DEPTH</h1>
    <p>Scroll down to spin through 3D spiral nature zoom layers</p>
  </header>

  <section class="vortex-pin">
    <div class="vortex-stage">
      <div class="vortex-card card-a">
        <img src="../../assets/nature1.jpeg" alt="Vortex 1">
        <div class="card-caption"><h2>VORTEX HORIZON</h2></div>
      </div>
      <div class="vortex-card card-b">
        <img src="../../assets/nature2.jpeg" alt="Vortex 2">
        <div class="card-caption"><h2>KINETIC APEX</h2></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Spiral Vortex 3D Parallax Zoom Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
