<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual-Asset Counter Crossfade Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">COUNTER CROSSFADE PARALLAX</span>
    <h1>DUAL ASSET MORPHING</h1>
    <p>Scroll down to crossfade nature1.jpeg into nature2.jpeg with counter motion</p>
  </header>

  <section class="cross-pin">
    <div class="cross-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Base" class="layer-base">
      <img src="../../assets/nature2.jpeg" alt="Nature Top" class="layer-top">
    </div>
    <div class="card-caption">
      <h2>DUAL ASSET CROSSFADE</h2>
      <p>Nature 1 ➔ Nature 2 Counter-Parallax Morph</p>
    </div>
  </section>

  <footer class="footer">
    <p>Dual-Asset Counter Crossfade Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
