<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Velocity Zoom & Inertia Skew</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">SCROLL VELOCITY INERTIA</span>
    <h1>DYNAMIC VELOCITY SKEW</h1>
    <p>Scroll fast to see real-time physics skew and inertia stretch</p>
  </header>

  <section class="card-section">
    <div class="velocity-card">
      <img src="../../assets/nature1.jpeg" alt="Nature Velocity 1" class="velocity-img">
      <div class="card-caption">
        <h2>01. HIGH-SPEED STRETCH</h2>
        <p>Dynamic Inertia Skew & Velocity Scale</p>
      </div>
    </div>

    <div class="velocity-card">
      <img src="../../assets/nature2.jpeg" alt="Nature Velocity 2" class="velocity-img">
      <div class="card-caption">
        <h2>02. KINETIC RETURN</h2>
        <p>Spring Physics Inverted Return</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Scroll Velocity Zoom & Inertia Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
