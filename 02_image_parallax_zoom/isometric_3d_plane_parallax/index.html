<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isometric 3D Plane Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">ISOMETRIC 3D PLANE</span>
    <h1>TILTED HEIGHT ELEVATION</h1>
    <p>Scroll down to slide cards across the isometric 3D plane</p>
  </header>

  <section class="iso-pin">
    <div class="iso-stage">
      <div class="iso-plane">
        <div class="iso-card card-a">
          <img src="../../assets/nature1.jpeg" alt="Iso Nature 1">
          <div class="card-caption">
            <h2>ELEVATION ALPHA</h2>
          </div>
        </div>
        <div class="iso-card card-b">
          <img src="../../assets/nature2.jpeg" alt="Iso Nature 2">
          <div class="card-caption">
            <h2>ELEVATION BETA</h2>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Isometric 3D Plane Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
