<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse 3D Tilt & Scroll Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">MOUSE 3D TILT PARALLAX</span>
    <h1>INTERACTIVE PERSPECTIVE</h1>
    <p>Scroll for parallax and move cursor over card for 3D tilt response</p>
  </header>

  <section class="tilt-section">
    <div class="tilt-wrapper">
      <div class="tilt-card">
        <img src="../../assets/nature2.jpeg" alt="Nature 3D Tilt" class="tilt-img">
        <div class="glare-layer"></div>
        <div class="card-caption">
          <h2>CYBER NATURE SHIELD</h2>
          <p>Interactive 3D Perspective Matrix Engine</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Mouse 3D Tilt + Scroll Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
