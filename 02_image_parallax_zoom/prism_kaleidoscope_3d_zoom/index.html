<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Prism Kaleidoscope Zoom</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">3D PRISM KALEIDOSCOPE</span>
    <h1>GEOMETRIC FACET UNFOLD</h1>
    <p>Scroll down to unfold 3D triangular prism facets into a composite image</p>
  </header>

  <section class="prism-pin">
    <div class="prism-stage">
      <div class="facet facet-tl"><img src="../../assets/nature1.jpeg" alt="Prism 1"></div>
      <div class="facet facet-tr"><img src="../../assets/nature1.jpeg" alt="Prism 2"></div>
      <div class="facet facet-bl"><img src="../../assets/nature1.jpeg" alt="Prism 3"></div>
      <div class="facet facet-br"><img src="../../assets/nature1.jpeg" alt="Prism 4"></div>
      <div class="card-caption">
        <h2>3D PRISM COMPOSITION</h2>
        <p>4-Facet Geometric Unfold Engine</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>3D Prism Kaleidoscope Zoom Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
