<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Mask Expand & Parallax Zoom</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">CIRCULAR APERTURE</span>
    <h1>CIRCLE MASK EXPANSION</h1>
    <p>Scroll down to expand the circle mask with deep image zoom-out</p>
  </header>

  <section class="circle-pin">
    <div class="circle-mask-layer">
      <img src="../../assets/nature1.jpeg" alt="Nature Circle Zoom" class="circle-img">
    </div>
    <div class="card-caption">
      <h2>LUXURY APERTURE</h2>
      <p>Circle Mask (12% ➔ 100%) | Image Scale (2.2 ➔ 1.0)</p>
    </div>
  </section>

  <footer class="footer">
    <p>Circle Mask Expand & Parallax Zoom Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
