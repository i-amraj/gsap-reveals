<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depth 3D Card Stack Fly-Through</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">3D FLY-THROUGH STACK</span>
    <h1>CAMERA FLY-PAST ZOOM</h1>
    <p>Scroll down to fly through 3D stacked nature card layers</p>
  </header>

  <section class="stack-pin">
    <div class="stack-stage">
      <div class="stack-card card-3">
        <img src="../../assets/nature1.jpeg" alt="Nature Stack 3">
        <div class="card-caption">
          <h2>03. HORIZON EXPEDITION</h2>
        </div>
      </div>
      <div class="stack-card card-2">
        <img src="../../assets/nature2.jpeg" alt="Nature Stack 2">
        <div class="card-caption">
          <h2>02. CANOPY DEPTH</h2>
        </div>
      </div>
      <div class="stack-card card-1">
        <img src="../../assets/nature1.jpeg" alt="Nature Stack 1">
        <div class="card-caption">
          <h2>01. ALPINE PEAK</h2>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Depth 3D Card Stack Fly-Through Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
