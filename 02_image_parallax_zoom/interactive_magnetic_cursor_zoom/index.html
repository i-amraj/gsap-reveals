<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Magnetic Cursor Zoom</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">MAGNETIC CURSOR ZOOM</span>
    <h1>SPRING PHYSICS PULL</h1>
    <p>Hover and move your mouse over the card to experience magnetic pull and depth scale</p>
  </header>

  <section class="magnetic-stage">
    <div class="mag-card">
      <img src="../../assets/nature1.jpeg" alt="Magnetic Nature" class="mag-img">
      <div class="card-caption">
        <h2>MAGNETIC ATTRACTION</h2>
        <p>GSAP quickTo Spring Physics Engine</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Interactive Magnetic Cursor Zoom Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
