<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cylindrical 3D Carousel Parallax</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">3D CYLINDER CAROUSEL</span>
    <h1>REVOLVING RING DEPTH</h1>
    <p>Scroll down to revolve the 3D cylinder image ring in space</p>
  </header>

  <section class="cylinder-pin">
    <div class="cylinder-stage">
      <div class="cylinder-ring">
        <div class="ring-card card-1"><img src="../../assets/nature1.jpeg" alt="Nature 1"></div>
        <div class="ring-card card-2"><img src="../../assets/nature2.jpeg" alt="Nature 2"></div>
        <div class="ring-card card-3"><img src="../../assets/nature1.jpeg" alt="Nature 3"></div>
        <div class="ring-card card-4"><img src="../../assets/nature2.jpeg" alt="Nature 4"></div>
      </div>
    </div>
    <div class="card-caption">
      <h2>REVOLVING SHOWROOM</h2>
      <p>3D Cylinder Rotation Engine</p>
    </div>
  </section>

  <footer class="footer">
    <p>Cylindrical 3D Carousel Parallax Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
