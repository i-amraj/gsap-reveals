<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagonal Slice Parallax Cascade</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-header">
    <span class="badge">DIAGONAL SLICE CASCADE</span>
    <h1>45-DEGREE PARALLAX SLICES</h1>
    <p>Scroll down to see 45-degree diagonal sloped strips slide into alignment</p>
  </header>

  <section class="diag-section">
    <div class="diag-container">
      <div class="diag-slice slice-1"><img src="../../assets/nature2.jpeg" alt="Slice 1"></div>
      <div class="diag-slice slice-2"><img src="../../assets/nature2.jpeg" alt="Slice 2"></div>
      <div class="diag-slice slice-3"><img src="../../assets/nature2.jpeg" alt="Slice 3"></div>
      <div class="diag-slice slice-4"><img src="../../assets/nature2.jpeg" alt="Slice 4"></div>
      <div class="card-caption">
        <h2>DIAGONAL CASCADE</h2>
        <p>45-Degree Polygon Strip Motion Profile</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>Diagonal Slice Parallax Cascade Engine</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
