<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Style Spotlight Cmd+K | Command Bar & Search (Cmd+K) Set 01</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow" style="background: radial-gradient(circle, #38bdf818, transparent 70%);"></div>

  <!-- Top Navigation Bar -->
  <div class="top-bar">
    <a href="../index.html" class="back-link">&larr; Back to Command Bar & Search (Cmd+K)</a>
    <span class="badge-tag">MODULE 06 &bull; SET 01</span>
  </div>

  <div class="stage-container">
    <!-- Component Stage Preview -->
    <div class="component-stage" id="componentStage">
      
        <div class="comp-cmdk-modal">
          <div class="cmdk-search-bar">
            <span class="cmdk-search-icon">🔍</span>
            <input type="text" placeholder="Type a command or search..." value="Deploy project" readonly>
            <span class="cmdk-esc-pill">ESC</span>
          </div>
          <div class="cmdk-results">
            <div class="cmdk-section-title">SUGGESTIONS</div>
            <div class="cmdk-item active" style="border-left: 3px solid #38bdf8;">
              <span>🚀 Deploy to Production</span>
              <span class="cmdk-shortcut">⌘P</span>
            </div>
            <div class="cmdk-item">
              <span>🎨 Switch Color Theme</span>
              <span class="cmdk-shortcut">⌘T</span>
            </div>
            <div class="cmdk-item">
              <span>⚙️ Open Global Settings</span>
              <span class="cmdk-shortcut">⌘,</span>
            </div>
          </div>
        </div>
        
    </div>

    <!-- Component Spec & Action Controller -->
    <div class="spec-panel">
      <div class="spec-meta">
        <span class="spec-cat">FORMS & SEARCH</span>
        <h2 class="spec-title">Linear Style Spotlight Cmd+K</h2>
      </div>

      <!-- Quick Action Buttons -->
      <div class="actions-row">
        <button class="action-btn primary" id="toggleStateBtn">⚡ Toggle State</button>
        <button class="action-btn" id="copyHtmlBtn">📄 Copy HTML</button>
        <button class="action-btn" id="copyCssBtn">📋 Copy CSS</button>
        <button class="action-btn" id="copyPromptBtn">🤖 Copy AI Prompt</button>
      </div>

      <!-- Specs Footer -->
      <div class="specs-grid">
        <div class="spec-item"><span>TYPE:</span> <strong>cmdk</strong></div>
        <div class="spec-item"><span>ACCENT:</span> <strong style="color:#38bdf8;">#38bdf8</strong></div>
        <div class="spec-item"><span>FRAMEWORK:</span> <strong>Vanilla CSS &amp; HTML5</strong></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>
  <script src="script.js"></script>
</body>
</html>
