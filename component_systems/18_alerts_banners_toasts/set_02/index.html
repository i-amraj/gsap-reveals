<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Action Undo Toast | Alerts, Banners & Toasts Set 02</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow" style="background: radial-gradient(circle, #818cf818, transparent 70%);"></div>

  <!-- Top Navigation Bar -->
  <div class="top-bar">
    <a href="../index.html" class="back-link">&larr; Back to Alerts, Banners & Toasts</a>
    <span class="badge-tag">MODULE 18 &bull; SET 02</span>
  </div>

  <div class="stage-container">
    <!-- Component Stage Preview -->
    <div class="component-stage" id="componentStage">
      
        <div class="comp-alert-banner" style="border-color:#818cf8; background:#818cf812;">
          <span class="alert-icon" style="color:#818cf8;">✦</span>
          <div>
            <strong style="color:#818cf8;">System Upgrade Notice:</strong>
            <span style="color:#cbd5e1; margin-left:0.5rem;">All nodes updated to 60FPS hardware acceleration.</span>
          </div>
        </div>
        
    </div>

    <!-- Component Spec & Action Controller -->
    <div class="spec-panel">
      <div class="spec-meta">
        <span class="spec-cat">NOTIFICATIONS & ALERTS</span>
        <h2 class="spec-title">Floating Action Undo Toast</h2>
      </div>

      <!-- Quick Action Buttons -->
      <div class="actions-row">
        <button class="action-btn primary" id="toggleStateBtn">⚡ Toggle State</button>
        <button class="action-btn" id="copyHtmlBtn">📄 Copy HTML</button>
        <button class="action-btn" id="copyCssBtn">📋 Copy CSS</button>
        <button class="action-btn" id="copyPromptBtn">🤖 Copy AI Prompt</button>
      </div>

      <!-- Specs Footer -->
      <div class="specs-grid">
        <div class="spec-item"><span>TYPE:</span> <strong>alerts</strong></div>
        <div class="spec-item"><span>ACCENT:</span> <strong style="color:#818cf8;">#818cf8</strong></div>
        <div class="spec-item"><span>FRAMEWORK:</span> <strong>Vanilla CSS &amp; HTML5</strong></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>
  <script src="script.js"></script>
</body>
</html>
