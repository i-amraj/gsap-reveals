<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Way Segmented Switcher | Toggle Switches & Flippers Set 06</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow" style="background: radial-gradient(circle, #ec489918, transparent 70%);"></div>

  <!-- Top Navigation Bar -->
  <div class="top-bar">
    <a href="../index.html" class="back-link">&larr; Back to Toggle Switches & Flippers</a>
    <span class="badge-tag">MODULE 27 &bull; SET 06</span>
  </div>

  <div class="stage-container">
    <!-- Component Stage Preview -->
    <div class="component-stage" id="componentStage">
      
        <div class="comp-switch-group">
          <span style="font-weight:600;">Monthly</span>
          <div class="toggle-track active" style="background:#ec4899;">
            <div class="toggle-thumb" style="transform:translateX(24px);"></div>
          </div>
          <span style="color:#ec4899; font-weight:700;">Annual (Save 20%)</span>
        </div>
        
    </div>

    <!-- Component Spec & Action Controller -->
    <div class="spec-panel">
      <div class="spec-meta">
        <span class="spec-cat">CONTROLS & SWITCHES</span>
        <h2 class="spec-title">3-Way Segmented Switcher</h2>
      </div>

      <!-- Quick Action Buttons -->
      <div class="actions-row">
        <button class="action-btn primary" id="toggleStateBtn">⚡ Toggle State</button>
        <button class="action-btn" id="copyHtmlBtn">📄 Copy HTML</button>
        <button class="action-btn" id="copyCssBtn">📋 Copy CSS</button>
        <button class="action-btn" id="copyPromptBtn">🤖 Copy AI Prompt</button>
      </div>

      <!-- Specs Footer -->
      <div class="specs-grid">
        <div class="spec-item"><span>TYPE:</span> <strong>switches</strong></div>
        <div class="spec-item"><span>ACCENT:</span> <strong style="color:#ec4899;">#ec4899</strong></div>
        <div class="spec-item"><span>FRAMEWORK:</span> <strong>Vanilla CSS &amp; HTML5</strong></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>
  <script src="script.js"></script>
</body>
</html>
