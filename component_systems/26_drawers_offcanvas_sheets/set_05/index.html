<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Peek Mini Drawer | Drawers & Offcanvas Sheets Set 05</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow" style="background: radial-gradient(circle, #f59e0b18, transparent 70%);"></div>

  <!-- Top Navigation Bar -->
  <div class="top-bar">
    <a href="../index.html" class="back-link">&larr; Back to Drawers & Offcanvas Sheets</a>
    <span class="badge-tag">MODULE 26 &bull; SET 05</span>
  </div>

  <div class="stage-container">
    <!-- Component Stage Preview -->
    <div class="component-stage" id="componentStage">
      
        <div class="comp-drawer-preview" style="border-color:#f59e0b50;">
          <div class="drawer-header">
            <strong style="color:#f59e0b;">Off-Canvas Settings Drawer</strong>
            <span>&times;</span>
          </div>
          <p>Quick settings, global token adjustments, and dark mode controls.</p>
          <button class="comp-btn-primary" style="background:#f59e0b; color:#000; width:100%;">Save Changes</button>
        </div>
        
    </div>

    <!-- Component Spec & Action Controller -->
    <div class="spec-panel">
      <div class="spec-meta">
        <span class="spec-cat">OVERLAYS & CANVAS</span>
        <h2 class="spec-title">Sticky Peek Mini Drawer</h2>
      </div>

      <!-- Quick Action Buttons -->
      <div class="actions-row">
        <button class="action-btn primary" id="toggleStateBtn">⚡ Toggle State</button>
        <button class="action-btn" id="copyHtmlBtn">📄 Copy HTML</button>
        <button class="action-btn" id="copyCssBtn">📋 Copy CSS</button>
        <button class="action-btn" id="copyPromptBtn">🤖 Copy AI Prompt</button>
      </div>

      <!-- Specs Footer -->
      <div class="specs-grid">
        <div class="spec-item"><span>TYPE:</span> <strong>drawers</strong></div>
        <div class="spec-item"><span>ACCENT:</span> <strong style="color:#f59e0b;">#f59e0b</strong></div>
        <div class="spec-item"><span>FRAMEWORK:</span> <strong>Vanilla CSS &amp; HTML5</strong></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>
  <script src="script.js"></script>
</body>
</html>
