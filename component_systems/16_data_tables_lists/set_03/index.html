<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow" style="background: radial-gradient(circle, #10b98118, transparent 70%);"></div>

  <!-- Top Navigation Bar -->
  <div class="top-bar">
    <a href="../index.html" class="back-link">&larr; Back to Data Tables & List Views</a>
    <span class="badge-tag">MODULE 16 &bull; SET 03</span>
  </div>

  <div class="stage-container">
    <!-- Component Stage Preview -->
    <div class="component-stage" id="componentStage">
      
        <table class="comp-table">
          <thead>
            <tr>
              <th>ENDPOINT</th>
              <th>STATUS</th>
              <th>LATENCY</th>
              <th>HEALTH</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>/api/v1/auth</code></td>
              <td><span style="color:#10b981;">Active</span></td>
              <td>12ms</td>
              <td>100%</td>
            </tr>
            <tr>
              <td><code>/api/v1/telemetry</code></td>
              <td><span style="color:#10b981;">Active</span></td>
              <td>8ms</td>
              <td>99.9%</td>
            </tr>
          </tbody>
        </table>

    <!-- Component Spec & Action Controller -->
    <div class="spec-panel">
      <div class="spec-meta">
        <span class="spec-cat">DATA & GRIDS</span>
        <h2 class="spec-title">User Avatar Activity List</h2>
      </div>

      <!-- Quick Action Buttons -->
      <div class="actions-row">
        <button class="action-btn primary" id="toggleStateBtn">⚡ Toggle State</button>
        <button class="action-btn" id="copyHtmlBtn">📄 Copy HTML</button>
        <button class="action-btn" id="copyCssBtn">📋 Copy CSS</button>
        <button class="action-btn" id="copyPromptBtn">🤖 Copy AI Prompt</button>
      </div>

      <!-- Specs Footer -->
      <div class="specs-grid">
        <div class="spec-item"><span>TYPE:</span> <strong>tables</strong></div>
        <div class="spec-item"><span>ACCENT:</span> <strong style="color:#10b981;">#10b981</strong></div>
        <div class="spec-item"><span>FRAMEWORK:</span> <strong>Vanilla CSS &amp; HTML5</strong></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>
  <script src="script.js"></script>
</body>
</html>
