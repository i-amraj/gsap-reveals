<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Capsule Music Pill | Audio & Media Players Set 02</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow" style="background: radial-gradient(circle, #818cf818, transparent 70%);"></div>

  <!-- Top Navigation Bar -->
  <div class="top-bar">
    <a href="../index.html" class="back-link">&larr; Back to Audio & Media Players</a>
    <span class="badge-tag">MODULE 20 &bull; SET 02</span>
  </div>

  <div class="stage-container">
    <!-- Component Stage Preview -->
    <div class="component-stage" id="componentStage">
      
        <div class="comp-audio-bar" style="border-color:#818cf840;">
          <button class="audio-play-btn" style="background:#818cf8; color:#000;">▶</button>
          <div class="track-info">
            <strong>Synthesizer Waveform No. 4</strong>
            <span>02:14 / 04:30</span>
          </div>
          <div class="eq-bars">
            <span style="background:#818cf8; height:14px;"></span>
            <span style="background:#818cf8; height:24px;"></span>
            <span style="background:#818cf8; height:18px;"></span>
            <span style="background:#818cf8; height:28px;"></span>
          </div>
        </div>
        
    </div>

    <!-- Component Spec & Action Controller -->
    <div class="spec-panel">
      <div class="spec-meta">
        <span class="spec-cat">MEDIA & INTERACTIVE</span>
        <h2 class="spec-title">Floating Capsule Music Pill</h2>
      </div>

      <!-- Quick Action Buttons -->
      <div class="actions-row">
        <button class="action-btn primary" id="toggleStateBtn">⚡ Toggle State</button>
        <button class="action-btn" id="copyHtmlBtn">📄 Copy HTML</button>
        <button class="action-btn" id="copyCssBtn">📋 Copy CSS</button>
        <button class="action-btn" id="copyPromptBtn">🤖 Copy AI Prompt</button>
      </div>

      <!-- Specs Footer -->
      <div class="specs-grid">
        <div class="spec-item"><span>TYPE:</span> <strong>audio</strong></div>
        <div class="spec-item"><span>ACCENT:</span> <strong style="color:#818cf8;">#818cf8</strong></div>
        <div class="spec-item"><span>FRAMEWORK:</span> <strong>Vanilla CSS &amp; HTML5</strong></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>
  <script src="script.js"></script>
</body>
</html>
