<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Scratch Card Reveal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <section class="spotlight-container">
    <img src="../../assets/showcase_art_alt.png" alt="Base Ambient Artwork" class="base-bg-img">

    <div class="bg-dark-overlay"></div>
    <div class="bg-dark-text">
      <span class="badge">INTERACTIVE SCRATCH CARD</span>
      <h2>SCRATCH SCREEN TO REVEAL</h2>
      <p>Hold Mouse & Scratch Surface to Reveal Secret Artwork</p>
      <button id="reset-btn">🔄 Clear Scratch Surface</button>
    </div>
    
    <img src="../../assets/showcase_art.png" alt="Top Neon Artwork" id="target-img">
    <canvas id="smoke-canvas"></canvas>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
