<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variation 4 - Dual Image Before & After Reveal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <span class="tag">VARIATION 4</span>
    <h1>Before & After Comparison</h1>
    <p>Black & White to Full Color Clip-Path Reveal</p>
    <div class="scroll-hint">↓ Scroll Down</div>
  </header>

  <section class="compare-container">
    <div class="img-stack">
      <!-- Bottom Layer: Grayscale Image -->
      <img src="../../assets/showcase_art_alt.png" alt="Grayscale Art" class="bw-img">
      
      <!-- Top Layer: Full Color Image (Clip Path Animate) -->
      <img src="../../assets/showcase_art.png" alt="Full Color Art" class="color-img">
    </div>
  </section>


  <section class="footer">
    <h2>Variation 4 Complete 🎉</h2>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
