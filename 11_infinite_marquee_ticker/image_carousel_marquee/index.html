<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Carousel Marquee</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>Marquees work perfectly for infinite image carousels.</p>
  </section>

  <section class="marquee-section">
    <div class="marquee-container">
      <div class="marquee-track">
        
        <!-- First Set of Images -->
        <div class="marquee-content">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&h=300&fit=crop" alt="Abstract 1">
          <img src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=500&h=300&fit=crop" alt="Abstract 2">
          <img src="https://images.unsplash.com/photo-1618005191295-8bc2c72b5093?w=500&h=300&fit=crop" alt="Abstract 3">
          <img src="https://images.unsplash.com/photo-1618004912476-29818d81ae2e?w=500&h=300&fit=crop" alt="Abstract 4">
          <img src="https://images.unsplash.com/photo-1614850715649-1d0106293cb1?w=500&h=300&fit=crop" alt="Abstract 5">
        </div>
        
        <!-- Exact Duplicate for seamless loop -->
        <div class="marquee-content">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&h=300&fit=crop" alt="Abstract 1">
          <img src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=500&h=300&fit=crop" alt="Abstract 2">
          <img src="https://images.unsplash.com/photo-1618005191295-8bc2c72b5093?w=500&h=300&fit=crop" alt="Abstract 3">
          <img src="https://images.unsplash.com/photo-1618004912476-29818d81ae2e?w=500&h=300&fit=crop" alt="Abstract 4">
          <img src="https://images.unsplash.com/photo-1614850715649-1d0106293cb1?w=500&h=300&fit=crop" alt="Abstract 5">
        </div>
        
      </div>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
