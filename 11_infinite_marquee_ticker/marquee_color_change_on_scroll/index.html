<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquee Color Change On Scroll</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-wrap">
    <section class="spacer">
      <h1>SCROLL DOWN</h1>
      <p>The marquee continues to loop while the theme changes.</p>
    </section>

    <section class="marquee-section">
      <div class="marquee-container">
        <div class="marquee-track">
          <div class="marquee-content">
            DYNAMIC THEME &bull; COLOR TRANSITION &bull; SCROLL LINKED &bull; 
          </div>
          <div class="marquee-content">
            DYNAMIC THEME &bull; COLOR TRANSITION &bull; SCROLL LINKED &bull; 
          </div>
        </div>
      </div>
    </section>

    <section class="spacer">
      <h1>KEEP SCROLLING</h1>
      <p>Notice the text color perfectly inherits the environment.</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
