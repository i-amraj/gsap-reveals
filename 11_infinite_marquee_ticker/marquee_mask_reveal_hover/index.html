<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquee Mask Reveal Hover</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-wrapper">
    
    <!-- Base Layer (Visible by default) -->
    <div class="base-layer">
      <h1>HOVER SCREEN</h1>
      <p>Discover what lies beneath.</p>
    </div>

    <!-- Reveal Layer (Hidden by clip-path circle, revealed on mouse hover) -->
    <div class="reveal-layer">
      <div class="marquee-container">
        <div class="marquee-track">
          <div class="marquee-content">
            HIDDEN LAYER &bull; INTERACTIVE REVEAL &bull; DYNAMIC MASKING &bull; 
          </div>
          <div class="marquee-content">
            HIDDEN LAYER &bull; INTERACTIVE REVEAL &bull; DYNAMIC MASKING &bull; 
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
