<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquee Split Directions</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>A single line of text sliced in half horizontally.</p>
  </section>

  <section class="marquee-section">
    <div class="marquee-wrapper">
      
      <!-- Top Half (Moves Left) -->
      <div class="marquee-track track-top">
        <div class="marquee-content">
          HORIZONTAL SLICE &bull; OPPOSING FORCES &bull; 
        </div>
        <div class="marquee-content">
          HORIZONTAL SLICE &bull; OPPOSING FORCES &bull; 
        </div>
      </div>

      <!-- Bottom Half (Moves Right) -->
      <div class="marquee-track track-bottom">
        <div class="marquee-content">
          HORIZONTAL SLICE &bull; OPPOSING FORCES &bull; 
        </div>
        <div class="marquee-content">
          HORIZONTAL SLICE &bull; OPPOSING FORCES &bull; 
        </div>
      </div>

    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
