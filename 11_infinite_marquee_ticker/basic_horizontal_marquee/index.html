<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Horizontal Marquee</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL DOWN</h1>
    <p>A flawless, infinitely scrolling marquee.</p>
  </section>

  <section class="marquee-section">
    <div class="marquee-container">
      <div class="marquee-track">
        <!-- We need exactly two copies of the text for the seamless -50% loop trick -->
        <div class="marquee-content">
          KINETIC TYPOGRAPHY &bull; INFINITE LOOP &bull; SEAMLESS ANIMATION &bull; 
        </div>
        <div class="marquee-content">
          KINETIC TYPOGRAPHY &bull; INFINITE LOOP &bull; SEAMLESS ANIMATION &bull; 
        </div>
      </div>
    </div>
  </section>

  <section class="spacer">
    <h1>KEEP SCROLLING</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
