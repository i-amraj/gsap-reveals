<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrub Only Marquee</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="spacer">
    <h1>SCROLL TO MOVE</h1>
    <p>This marquee does not auto-play. You control it.</p>
  </section>

  <section class="marquee-section">
    <div class="marquee-container">
      <div class="marquee-track">
        <div class="marquee-content">
          MANUAL SCRUBBING &bull; SCROLL CONTROLLED &bull; NO AUTO PLAY &bull; 
        </div>
        <div class="marquee-content">
          MANUAL SCRUBBING &bull; SCROLL CONTROLLED &bull; NO AUTO PLAY &bull; 
        </div>
      </div>
    </div>
  </section>

  <section class="spacer" style="height: 200vh;">
    <h1>LONG SCROLL</h1>
    <p>The marquee progresses relative to the page scroll distance.</p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
