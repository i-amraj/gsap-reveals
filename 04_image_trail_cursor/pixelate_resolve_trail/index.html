<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelate Resolve Trail</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- SVG filter for pixelation effect -->
  <svg style="display:none;">
    <filter id="pixelate">
      <feMorphology id="morphRadius" operator="dilate" radius="15" in="SourceGraphic" />
    </filter>
  </svg>

  <div class="trail-container">
    <header class="hero-header">
      <span class="badge">RETRO 8-BIT</span>
      <h1>PIXELATE RESOLVE</h1>
      <p>Images spawn as chunky mosaics and resolve to sharp</p>
    </header>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
