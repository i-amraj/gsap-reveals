<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Scrub Sequence</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="trail-container">
    <header class="hero-header">
      <span class="badge">INTERACTIVE TIMELINE</span>
      <h1>FLIPBOOK SCRUB</h1>
      <p>Move mouse left and right to scrub through the image sequence</p>
    </header>
    
    <div class="sequence-stack">
      <img src="../../assets/nature1.jpeg" class="seq-img" alt="Frame 1">
      <img src="../../assets/nature2.jpeg" class="seq-img" alt="Frame 2">
      <img src="../../assets/nature1.jpeg" class="seq-img" alt="Frame 3">
      <img src="../../assets/nature2.jpeg" class="seq-img" alt="Frame 4">
      <img src="../../assets/nature1.jpeg" class="seq-img" alt="Frame 5">
      <img src="../../assets/nature2.jpeg" class="seq-img" alt="Frame 6">
      <img src="../../assets/nature1.jpeg" class="seq-img" alt="Frame 7">
      <img src="../../assets/nature2.jpeg" class="seq-img" alt="Frame 8">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
