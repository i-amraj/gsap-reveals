      <img src="../../assets/nature2.jpeg" class="snake-node">
      <img src="../../assets/nature1.jpeg" class="snake-node">
      <img src="../../assets/nature2.jpeg" class="snake-node">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
