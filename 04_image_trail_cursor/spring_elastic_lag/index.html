<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Elastic Lag</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="trail-container">
    <header class="hero-header">
      <span class="badge">PHYSICS ENGINE</span>
      <h1>ELASTIC SPRING LAG</h1>
      <p>Move cursor rapidly to stretch the elastic image chain</p>
    </header>
    
    <!-- Hardcoded images for the elastic chain -->
    <img src="../../assets/nature1.jpeg" class="elastic-img img-5" alt="Lag 5">
    <img src="../../assets/nature2.jpeg" class="elastic-img img-4" alt="Lag 4">
    <img src="../../assets/nature1.jpeg" class="elastic-img img-3" alt="Lag 3">
    <img src="../../assets/nature2.jpeg" class="elastic-img img-2" alt="Lag 2">
    <img src="../../assets/nature1.jpeg" class="elastic-img img-1" alt="Lag 1 (Lead)">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
