<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Parallax Horizontal Cards</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h2>Scroll Down to Parallax</h2></div>
  
  <div class="pin-wrap" id="pin-wrap">
    <div class="card-track" id="card-track">
      <!-- Cards -->
      <div class="card"><div class="card-img" style="background-image:url('https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=800&auto=format&fit=crop')"></div><h3 class="card-title">Explore</h3></div>
      <div class="card"><div class="card-img" style="background-image:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=800&auto=format&fit=crop')"></div><h3 class="card-title">Discover</h3></div>
      <div class="card"><div class="card-img" style="background-image:url('https://images.unsplash.com/photo-1506744012022-b5e13d100062?q=80&w=800&auto=format&fit=crop')"></div><h3 class="card-title">Wander</h3></div>
      <div class="card"><div class="card-img" style="background-image:url('https://images.unsplash.com/photo-1472396961693-142e6e269027?q=80&w=800&auto=format&fit=crop')"></div><h3 class="card-title">Journey</h3></div>
    </div>
  </div>

  <div class="spacer"><h2>End of track</h2></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
