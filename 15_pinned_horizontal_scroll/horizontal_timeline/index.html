<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizontal Timeline</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <div class="pin-wrap" id="pin-wrap">
    <div class="timeline-line">
      <div class="timeline-progress" id="progress"></div>
    </div>
    <div class="track" id="track">
      <div class="event"><div class="dot"></div><h2>2020</h2><p>Founded.</p></div>
      <div class="event"><div class="dot"></div><h2>2021</h2><p>First Product.</p></div>
      <div class="event"><div class="dot"></div><h2>2022</h2><p>Series A.</p></div>
      <div class="event"><div class="dot"></div><h2>2023</h2><p>Global.</p></div>
      <div class="event"><div class="dot"></div><h2>2024</h2><p>Future.</p></div>
    </div>
  </div>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
