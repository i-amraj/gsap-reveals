<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizontal Accordion</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <div class="pin-wrap" id="pin-wrap">
    <div class="accordion-container">
      <div class="acc-panel a1"><h2>Design</h2><p>Crafting beautiful interfaces.</p></div>
      <div class="acc-panel a2"><h2>Develop</h2><p>Writing robust code.</p></div>
      <div class="acc-panel a3"><h2>Deploy</h2><p>Shipping to the world.</p></div>
      <div class="acc-panel a4"><h2>Iterate</h2><p>Improving continuously.</p></div>
    </div>
  </div>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
