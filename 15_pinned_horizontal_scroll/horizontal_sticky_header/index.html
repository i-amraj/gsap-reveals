<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizontal Sticky Header</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <div class="pin-wrap" id="pin-wrap">
    <div class="sticky-header">
      <h2>PORTFOLIO</h2>
      <p>Scroll to explore my works.</p>
    </div>
    
    <div class="track" id="track">
      <div class="panel"><div class="box">Project 1</div></div>
      <div class="panel"><div class="box">Project 2</div></div>
      <div class="panel"><div class="box">Project 3</div></div>
      <div class="panel"><div class="box">Project 4</div></div>
      <div class="panel"><div class="box">Project 5</div></div>
    </div>
  </div>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
