<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Skew On Scroll</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h2>Scroll Down to Skew</h2></div>
  
  <div class="pin-wrap" id="pin-wrap">
    <div class="track" id="track">
      <div class="skew-card c1">1</div>
      <div class="skew-card c2">2</div>
      <div class="skew-card c3">3</div>
      <div class="skew-card c4">4</div>
      <div class="skew-card c5">5</div>
    </div>
  </div>

  <div class="spacer"><h2>End of track</h2></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
