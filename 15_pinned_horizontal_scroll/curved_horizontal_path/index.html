<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Curved Horizontal Path</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <div class="pin-wrap" id="pin-wrap">
    <div class="track" id="track">
      <div class="circle c1">1</div>
      <div class="circle c2">2</div>
      <div class="circle c3">3</div>
      <div class="circle c4">4</div>
      <div class="circle c5">5</div>
      <div class="circle c6">6</div>
    </div>
  </div>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
