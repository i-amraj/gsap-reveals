<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Basic Horizontal Scroll</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <div class="horizontal-container" id="pin-container">
    <div class="track" id="track">
      <div class="panel p1"><h2>Panel 1</h2></div>
      <div class="panel p2"><h2>Panel 2</h2></div>
      <div class="panel p3"><h2>Panel 3</h2></div>
      <div class="panel p4"><h2>Panel 4</h2></div>
    </div>
  </div>

  <div class="spacer"><h1>Keep Scrolling</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
