<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizontal Cursor Drag</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="drag-wrap">
    <div class="drag-track" id="track">
      <div class="slide"><h1>DRAG</h1></div>
      <div class="slide"><h1>ME</h1></div>
      <div class="slide"><h1>LEFT</h1></div>
      <div class="slide"><h1>OR</h1></div>
      <div class="slide"><h1>RIGHT</h1></div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <!-- Draggable plugin required -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
