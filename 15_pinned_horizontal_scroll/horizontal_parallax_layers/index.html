<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizontal Parallax Layers</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet"></head>
<body>
  <div class="spacer"><h1>Scroll Down</h1></div>
  
  <div class="pin-wrap" id="pin-wrap">
    <!-- Background Layer (Moves Slow) -->
    <div class="layer bg-layer" id="bg-layer">
      <h1>BACKGROUND BACKGROUND BACKGROUND</h1>
    </div>
    <!-- Midground Layer (Moves Medium) -->
    <div class="layer mid-layer" id="mid-layer">
      <div class="box m1"></div><div class="box m2"></div><div class="box m3"></div>
    </div>
    <!-- Foreground Layer (Moves Fast) -->
    <div class="layer fg-layer" id="fg-layer">
      <div class="box f1"></div><div class="box f2"></div><div class="box f3"></div>
    </div>
  </div>

  <div class="spacer"><h1>End</h1></div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
