<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dark Mode Toggle Hero</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <!-- A circular mask that will grow to cover the screen for the mode switch -->
  <div class="mode-mask"></div>

  <section class="hero-section">
    <div class="header">
      <div class="logo">SHIFT.</div>
      <button id="toggle-btn">Toggle Mode</button>
    </div>
    
    <div class="content">
      <h1 class="title">DAY & NIGHT</h1>
      <p>A seamless, GSAP-powered theme transition.</p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
