<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Split Screen Hero</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="split-hero">
    <div class="left-panel">
      <div class="content">
        <h1 class="split-line"><span>We build</span></h1>
        <h1 class="split-line"><span>Future</span></h1>
        <h1 class="split-line"><span>Interfaces.</span></h1>
        <p class="fade-in">Award-winning digital studio crafting immersive web experiences for global brands.</p>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="image-reveal">
        <div class="image-inner"></div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
