<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizontal Scroll Hero</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet"></head>
<body>
  
  <div class="scroll-container">
    <section class="horizontal-panel hero-panel">
      <h1>Scroll to<br>Explore</h1>
      <p>Scroll down, move right.</p>
    </section>
    
    <section class="horizontal-panel image-panel">
      <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Art 1">
    </section>
    
    <section class="horizontal-panel image-panel">
      <img src="https://images.unsplash.com/photo-1518640467707-6811f4a6ab73?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Art 2">
    </section>
    
    <section class="horizontal-panel text-panel">
      <h2>The Gallery</h2>
      <a href="#">Enter Now</a>
    </section>
  </div>

  <section class="spacer">
    <h1>End of Horizontal</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
