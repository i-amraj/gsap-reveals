<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Text Hover Image Reveal Hero</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet"></head>
<body>
  
  <!-- The image that follows the cursor -->
  <div class="hover-image-wrapper">
    <div class="hover-image" id="reveal-img"></div>
  </div>

  <section class="hero-section">
    <div class="menu-list">
      <div class="menu-item" data-img="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">
        <h1>Nature</h1>
      </div>
      <div class="menu-item" data-img="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">
        <h1>Urban</h1>
      </div>
      <div class="menu-item" data-img="https://images.unsplash.com/photo-1518837695005-2083093ee35b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">
        <h1>Ocean</h1>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
