<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Circular Text Marquee Hero</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="hero-section">
    <div class="content">
      <h1>Modern <br> <span class="italic">Aesthetics</span></h1>
    </div>
    
    <div class="circular-badge">
      <!-- We will generate the circular text via JS for perfect curve -->
      <svg viewBox="0 0 200 200" id="badge-svg">
        <path id="circlePath" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="none" />
        <text>
          <textPath href="#circlePath" class="circular-text">
            SCROLL TO EXPLORE • AWWWARDS DESIGN • CREATIVE AGENCY • 
          </textPath>
        </text>
      </svg>
      <div class="badge-center">↓</div>
    </div>
  </section>
  
  <section class="spacer"></section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
