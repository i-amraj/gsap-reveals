<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fullscreen Slider Hero</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="slider-hero">
    
    <div class="slide slide-1">
      <div class="slide-bg"></div>
      <div class="slide-content"><h1>ARCHITECTURE</h1></div>
    </div>
    
    <div class="slide slide-2">
      <div class="slide-bg"></div>
      <div class="slide-content"><h1>FURNITURE</h1></div>
    </div>
    
    <div class="slide slide-3">
      <div class="slide-bg"></div>
      <div class="slide-content"><h1>INTERIOR</h1></div>
    </div>

    <!-- UI Controls -->
    <div class="slider-controls">
      <button id="prev-btn">Prev</button>
      <div class="pagination">1 / 3</div>
      <button id="next-btn">Next</button>
    </div>
    
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
