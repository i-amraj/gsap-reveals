<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Video Background Mask Hero</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"></head>
<body>
  
  <section class="video-mask-hero">
    <!-- Using a container with mix-blend-mode for text masking over video -->
    <div class="video-container">
      <video autoplay muted loop playsinline id="bg-video">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      </video>
    </div>
    
    <div class="text-mask">
      <h1 class="mask-title">CREATE</h1>
    </div>
  </section>
  
  <section class="next-section">
    <h2>Discover the unknown.</h2>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
